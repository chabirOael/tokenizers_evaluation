tokenizer:
  type: "araroopat"
  vocab_size: null  # Derived from max_roots + max_patterns + fixed slots; ignored.
  params:
    # ----- Vocab budget (three pre-set tiers; pick one) -----
    # Re-tiered 2026-08-30 after the '#' weak-radical fix. Keeping CAMeL's
    # masked radical moves the weak letter's identity out of the root and
    # into the pattern, so the pattern inventory grew 8,634 -> 21,578 unique
    # (15,219 at freq>=2) while unique roots barely moved (3,338 -> 4,331).
    # max_roots is now never the binding constraint; max_patterns is.
    #
    # Measured admission (share of word occurrences reaching the ROOT+PAT
    # path on 300 real Arabic-Exam questions; CAMeL analyzes 66.6 % of them,
    # which is the ceiling for any budget):
    #   patterns   500 -> 26.2 %   (vocab ~4.7K)
    #   patterns  1000 -> 33.6 %   (vocab ~5.2K)
    #   patterns  2000 -> 42.2 %   (vocab ~6.2K)
    #   patterns  4000 -> 48.2 %   (vocab ~8.2K)   <- default
    #   patterns  6076 -> 52.1 %   (vocab ~10.3K)  all patterns with freq>=2
    # Raising max_roots 10000 -> 15000 changes nothing (only 4,128 roots
    # clear min_root_freq), so spend the budget on patterns.
    #
    # Compact:   max_roots: 10000, max_patterns: 1000   (~5.2K, 33.6 % admission)
    # Balanced:  max_roots: 10000, max_patterns: 4000   (~8.2K, 48.2 %)  <- default
    # Max:       max_roots: 10000, max_patterns: 6076   (~10.3K, 52.1 %)
    max_roots: 10000
    max_patterns: 4000

    min_root_freq: 2
    min_pattern_freq: 2

    # Tier-2 reconstruction: cap CAMeL Generator wall-clock per call (ms).
    # Falls through to tier-3 (naive substitution) on timeout. Defaults to a
    # generous 50 ms — most generator calls finish in <1 ms.
    generator_timeout_ms: 50

    # Whether the lookup table stores diacritized or undiacritized surfaces.
    # ``false`` matches typical Arabic text (no tashkeel) and gives smaller
    # storage; set ``true`` only if downstream tasks need full diacritics.
    use_diacritized_surface: false

    # Cache the per-corpus CAMeL pre-pass to disk. Re-using the cache across
    # different (max_roots, max_patterns) tiers saves ~30 min per run.
    cache_corpus_analysis: true

    # Wrap encode() output with <s>...</s>. Standard for the platform.
    add_bos_eos: true

    # Closed-list clitic peeler, run only when CAMeL has no analysis for the
    # whole word. calima-msa-r13 has no interrogative-أ prefix row, no second
    # enclitic slot (enc1) and no lengthened كمو/همو, so أتكتب / سلمتكها /
    # أنلزمكموها had no analysis at all. The peeler strips exactly those
    # clitics and sends the residual to CAMeL; anything CAMeL models natively
    # (و/ف/ب/ل/ك/ال/س, a single pronoun) is never peeled. The interrogative
    # is accepted as أ or, opt-in, bare ا (for alef-normalised text).
    # Lengthened forms get their own [CLITICE_كمو] / [CLITICE_همو] tokens —
    # no surface is rewritten. Changing this re-runs the corpus pre-pass
    # (cache key).
    clitic_peeler: true
    # Also accept a bare ا as the interrogative (the platform's preprocessing
    # may normalise أ → ا; it is off since 2026-09-16). Off by default: word-initial ا is also hamzat-wasl
    # (Forms VII–X, imperatives), ابن/اسم and the article, and enabling it
    # doubled false peels on CAMeL-rejected corpus types (0.6 % → 1.2 %).
    peel_bare_alef: false

    # Proper nouns — a word whose CAMeL reading is a *database* noun_prop
    # (not the NOAN_PROP backoff guess CAMeL stamps on every unknown word) is
    # emitted as its characters between [PROP_BEGIN] / [PROP_END], clitics
    # outside (بمكة → [CLITICP_ب] [PROP_BEGIN] م ك [PROP_END] [CLITICE_ة]).
    #   unrooted — only the names CAMeL has no root for (باريس كوريا أكتوبر
    #              بن أبي: 3.0 % of corpus words, all LIT before); names with
    #              a root (محمد مصر القاهرة الله: 2.5 %) keep ROOT+PAT.
    #   all      — every database name, rooted ones too (they then stop
    #              feeding the root / pattern tables; +2.7 % fertility).
    # Applied at vocab-build and encode time, not in the pre-pass cache:
    # switching it re-runs only the vocab build.
    proper_nouns: unrooted

    # Closed-class prepositions / particles emitted as ONE [PREP_*] token
    # each (clitics still ride outside: [CLITICP_و] [PREP_إلى] [CLITICE_ه]).
    # Matched on CAMeL's lemma, so عليه / منهم / وإلى all resolve to their
    # base. Without this, من/عن/في fail the 3-radical gate and cost four
    # [LIT_*]/[CHAR_*] tokens each, while إلى/على/حتى get a bogus root+wazn.
    # Order = vocab ID order; omit the key to use this same default list.
    prepositions:
      - من
      - إلى
      - عن
      - على
      - في
      - حتى
      - منذ
      - مذ
      - خلا
      - عدا
      - حاشا
      - متى
      - لعل
      - كي
      - لولا
      # CAMeL POS `prep` lemmas added 2026-09-16: مع went to LIT (2 radicals,
      # معهم / معه too), تجاه and خلال got a root+wazn, بلا went to LIT.
      # Pronoun-hosted لِ / بِ / كَ (له, بها, لنا, بهم) are NOT listed: they
      # are emitted as clitic tokens only ([CLITICP_ل] [CLITICE_ه]) —
      # PRONOUN_HOSTING_PROCLITICS in the backend, always on.
      - مع
      - تجاه
      - خلال
      - بلا

    # Closed-class function words emitted as ONE [FUNC_*] token each (added
    # 2026-09-16): pronouns, demonstratives, relatives, conjunctions,
    # subordinators, interrogatives, negation / verbal / future particles.
    # Same mechanics as the prepositions — matched on CAMeL's lemma or the
    # bare surface, alef-insensitively (ان → أن), clitics outside:
    # [CLITICP_و] [FUNC_هم], [FUNC_أن] [CLITICE_هم] for أنهم, [CLITICP_ل]
    # [FUNC_قد] for لقد. Before this group these words cost four tokens on
    # the character path (هم هي ما لا الذي هذا قد هل لم لن) or a bogus
    # root+wazn (أو إذا لكن ثم كيف سوف); together ~8 % of all word
    # occurrences. The list is a SURFACE list (هذه and الذين are listed,
    # not derived from هذا / الذي); a surface may not also be a preposition.
    # Order = vocab ID order (the range follows [PREP_*], before [CHAR_*]).
    # Candidates come from scripts/discover_araroopat_func_words.py, which
    # runs CAMeL over the corpus and lists every closed-class POS with
    # counts; curate from its func_by_lemma.csv. Omit the key to use the
    # backend default (FUNC_INVENTORY); changing it re-runs the pre-pass.
    func_words:
      # personal pronouns + the object-pronoun carrier إيا (إياه, إياك)
      - هو
      - هي
      - هم
      - هن
      - هما
      - أنا
      - أنت
      - أنتم
      - أنتن
      - أنتما
      - نحن
      - إيا
      # demonstratives
      - هذا
      - هذه
      - هذان
      - هاتان
      - هؤلاء
      - ذلك
      - تلك
      - ذاك
      - أولئك
      # relatives
      - الذي
      - التي
      - الذين
      - اللذان
      - اللتان
      - اللاتي
      - اللواتي
      - اللائي
      # conjunctions / subordinators
      - أن
      - إن
      - أو
      - أم
      - ثم
      - بل
      - لكن
      - إذا
      - إذ
      - حيث
      - كما
      - لو
      - إما
      - أما
      - إلا
      - ألا
      - بينما
      - حينما
      - عندما
      - كلما
      - لأن
      - كأن
      - ليت
      - إذن
      - هكذا
      - كذا
      - مثلما
      - طالما
      - حسبما
      - أينما
      - فيما          # CAMeL reads it as a fused subordinator (lemma ما, no clitic split)
      # closed-class nouns CAMeL cannot decompose (root NTWS); ذات keeps a
      # possessive pronoun (ذاته, ذاتها, بذاتها — POSSESSIVE_FUNC_WORDS)
      - ذات
      # interrogatives
      - ما
      - ماذا
      - لماذا
      - كيف
      - أين
      - هل
      - أي
      - كم
      - أيان
      - أنى
      # particles: negation, verbal, future
      - لا
      - لم
      - لن
      - لما
      - قد
      - سوف

  save_path: "outputs/tokenizers/araroopat_balanced"
