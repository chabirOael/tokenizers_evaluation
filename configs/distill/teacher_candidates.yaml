# Teacher bake-off candidates (2026-09-23, docs/report.md §3.8). Every candidate answers the same
# 250 cidar-dev prompts under vLLM (.venv-judge): greedy, seed 0, no repetition penalty, its own
# chat template with the system prompt of arabic_eval.distill.teacher.SYSTEM_PROMPT, thinking off,
# stop at its own EOS / end of turn, token cap = ceil(2400 / chars_per_token × 1.15) + 8 with
# chars_per_token measured on the dev references with its tokenizer (derive_token_cap).
# Excluded by rule: the judge's family (Gemma-4, Fanar-2) and any Qwen model (the native arm's
# vocabulary). `revision` pins the snapshot every run loads; `load_repo` names a cached alias of the
# same snapshot; `fallbacks` are tried in order when the first load fails.
max_model_len: 4096
seed: 0
candidates:
  - slug: jais2_8b
    params_b: 8
    repo: inceptionai/Jais-2-8B-Chat
    revision: da0e1639cd92b508b24120f7f77f5270a8465dc4
    dtype: bfloat16
    gpu_memory_utilization: 0.90
    notes: "Arabic-first, own 150 K vocabulary, Apache 2.0; vLLM jais2.py"
  - slug: llama33_70b_awq
    params_b: 70
    repo: casperhansen/llama-3.3-70b-instruct-awq
    revision: 64d255621f40b42adaf6d1f32a47e1d4534c0f14
    dtype: auto
    gpu_memory_utilization: 0.92
    notes: "AWQ int4 of meta-llama/Llama-3.3-70B-Instruct (AraGen v3 52.1 for the bf16 model)"
