    params_b: 34
    repo: tiiuae/Falcon-H1-34B-Instruct
    revision: 6e6890e26cba1f58b1e6ee70d654ddf054f9fce8
    dtype: bfloat16
    gpu_memory_utilization: 0.95
    fallbacks:
      # bf16 at the default max_num_seqs OOMs on 2026-09-23: vLLM's CUDA-graph profiling allocates a minimal
      # state cache of 73.1 GiB (a Mamba state per sequence slot) on top of 63 GiB of weights. Fewer concurrent
      # sequences is a capacity knob, not a precision change, so it is tried before fp8 / GPTQ.
      - {engine_kwargs: {max_num_seqs: 32}}
      - {quantization: fp8, engine_kwargs: {max_num_seqs: 64}}
      - {repo: tiiuae/Falcon-H1-34B-Instruct-GPTQ-Int4, revision: d94ad5a4d96a39c7416da06d6e5555896c31ff35, dtype: auto, engine_kwargs: {max_num_seqs: 64}}
