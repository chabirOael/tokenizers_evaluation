# GENERATED by scripts/render_task_presets.py from FreeformCidarTask.param_spec() — do not edit by hand,
# re-run the script after changing the spec (tests/test_task_param_specs.py pins the equality).
#
# A run NEVER reads this file. The pipeline takes a task's parameters from the experiment YAML's
# `sweep.tasks[].params` only; an absent key means the code default listed here. This file is the
# documentation of every parameter the `freeform_cidar` task declares, with its default and type; the
# experiment console renders the same spec live as a typed card (`/api/schema` → task_params).
task:
  type: "freeform_cidar"
  params:
    # — budget —
    # Budget of decoded text per answer, in CHARACTERS — the same amount of text for every tokenizer; it becomes a per-tokenizer max_new_tokens from the measured chars/token (2400 since 2026-09-21; 1200 capped 12 of the control's 250 answers). [int; range 32–…]
    max_output_chars: 2400
    # Safety factor on the derived token cap: max_new_tokens = max_output_chars / chars_per_token × margin + 8, before clamping. [float; range 1–…; advanced]
    token_cap_margin: 1.15
    # Lower clamp of the derived token cap (a tokenizer with huge chars/token still gets this many tokens). [int; range 1–…; advanced]
    token_cap_floor: 32
    # Upper clamp of the derived token cap (char-JABER lands near 2 800, well under it). [int; range 1–…; advanced]
    token_cap_ceiling: 4096
    # Longest prompt encoding kept (tokenizer truncation beyond it) before generation. [int; range 16–…]
    max_prompt_tokens: 512
    # — stops —
    # Decoded-text stop strings: the model starting a new prompt block, in the templates' exact words (derived from finetune_corpora.py; never a bare \n### — that cut the model's own markdown sub-headers). One marker per line in the form. [list[str]]
    stop_markers:
      - "\nالسؤال:"
      - "\nالسياق:"
      - "\nالإجابة:"
      - "\n### التعليمات:"
      - "\n### المدخل:"
      - "\n### السياق:"
      - "\n### السؤال:"
      - "\n### الإجابة:"
      - "\nفيما يلي تعليمات"
      - "\nفيما يلي نص"
    # Decode the unfinished sequences and look for a marker / loop every this many generation steps. [int; range 1–…; advanced]
    marker_check_every: 16
    # Stop a sequence whose decoded text ends in a repetition loop (periodic tail or a letter ×20), cut right after the first copy; tokenizer-agnostic, unlike a token repetition penalty. [bool]
    loop_stop: true
    # — scoring —
    # Encoder of the in-house BERTScore (tasks/freeform/bertscore.py); null skips BERTScore. [str | null]
    bertscore_model: "xlm-roberta-large"
    # Hidden layer of the encoder whose token vectors BERTScore matches (17 for xlm-roberta-large). [int; range 0–…; advanced]
    bertscore_layer: 17
    # Sentence pairs per BERTScore forward pass. [int; range 1–…; advanced]
    bertscore_batch_size: 32
    # — misc —
    # Prompts generated per batch (left-padded); memory only, the greedy output does not depend on it. [int; range 1–…]
    batch_size: 16
    # Recorded in the row dump; greedy decoding itself is deterministic. [int; range 0–…]
    seed: 42
    # The held-out JSONL of prompts (id, prompt, reference, stratum); the committed v1 set of 250 CIDAR rows, also the freeform_prompts held-out set of the contamination check. [path]
    heldout_path: "configs/contamination/freeform_cidar_heldout_v1.jsonl"
