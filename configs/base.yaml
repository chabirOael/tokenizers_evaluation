seed: 42
deterministic: true

data:
  dataset_name: "Jr23xd23/ArabicText-Large"
  cache_dir: "outputs/data_cache"
  train_split: "train"
  eval_split: "test"
  max_train_samples: null
  max_eval_samples: 10000
  preprocessing:
    normalize_unicode: true
    remove_diacritics: false
    min_text_length: 10

model:
  type: "llama"
  name_or_path: "meta-llama/Llama-3.2-1B"
  dtype: "bfloat16"
  device: "auto"

training:
  bf16: true
  fp16: false
  logging_steps: 50
  # Packed raw-text mix for Phase 1 / Phase 2. Inert until a phase sets
  # ``datasets: ["pretraining_mix"]`` + ``mix_tokens`` (then loss_target must
  # be full_sequence, max_length must equal block_size, and
  # mix_tokens == steps × batch_size × block_size — steps may be omitted).
  # Stage A (pool, this block) is cached under cache_dir/<fingerprint> and
  # shared by every cell; Stage B packs the WHOLE pool once per tokenizer
  # (largest budget at which the shares hold exactly) under
  # <pool>/packed/<tokenizer_fp>/. Phases draw disjoint consecutive slices
  # of it — the pool must hold Σ mix_tokens for the lowest-fertility
  # tokenizer (CharacterBERT ≈ 1 token/word) or packing raises. A mix phase
  # may add ``qa_blend: {datasets, share, split, seed}`` — SFT-format QA
  # train records (Phase 3 / eval surface form) packed the same way and
  # replacing round(share × blocks) of the phase's raw-text blocks (cached
  # once per tokenizer under cache_dir/qa_blend/; Phase 3 early-stop splits
  # are refused).
  # Build / calibrate offline: scripts/build_pretraining_mix.py.
  pretraining_mix:
    block_size: 512
    seed: 42
    cache_dir: "outputs/data_cache/pretraining_mix"
    normalization:                  # parity with the un-normalized QA phases: NFKC + tatweel + whitespace only
      nfkc: true
      remove_tatweel: true
      normalize_alef: false
      remove_diacritics: false
    sources:
      - name: "fineweb2_arb"        # HuggingFaceFW/fineweb-2, arb_Arab (streamed, shard-shuffled)
        share: 0.70
        params: {config: "arb_Arab", min_language_score: 0.80}   # 0.7–0.9 rows measured indistinguishable from ≥0.9; 0.90 skipped 39 % of the stream for nothing
      - name: "wikipedia_ar"        # wikimedia/wikipedia 20231101.ar
        share: 0.20
        params: {dump: "20231101.ar", skip_title_prefixes: ["قائمة"]}
      - name: "arabicweb24"         # lightonai/ArabicWeb24 (gated → HF_TOKEN); swap for arabic_101b if needed
        share: 0.10
        params: {}
    pool:
      total_words: 20000000         # post-filter words, split by share; ≥ token_budget suffices for any tokenizer (fertility ≥ 1)
      stream_shuffle_buffer: 10000
      max_stream_docs_per_source: 3000000
    dedup:
      paragraph_exact: true         # repeated normalized paragraphs removed from docs (boilerplate)
      minhash: {enabled: true, num_perm: 128, shingle_words: 5, threshold: 0.80}
      priority: ["wikipedia_ar", "fineweb2_arb", "arabicweb24"]   # surviving copy of a cross-source duplicate
    msa_filter:
      heuristic: {enabled: true, max_markers_per_1k_words: 8.0, min_markers: 3, min_distinct_markers: 2}   # calibrated 2026-09-14 (see CLAUDE.md)
      camel_did: {enabled: false, sentences_per_doc: 8, min_sentence_words: 5, min_msa_share: 0.30}  # opt-in; measured to flag 16 % of *MSA* Wikipedia — keep off
    quality:
      min_words: 50
      max_words: 3000               # truncated at a paragraph boundary, not dropped
      strip_latin_parentheticals: true   # "(بالإنجليزية: Name)" glosses removed before the ratio rules
      max_latin_letter_ratio: 0.05
      min_arabic_letter_ratio: 0.70
      max_short_line_ratio: 0.50
      short_line_words: 5
      max_dup_line_ratio: 0.30
      max_symbol_ratio: 0.10
      wikipedia_strip_sections: ["المراجع", "مراجع", "وصلات خارجية", "انظر أيضا", "انظر أيضًا", "انظر أيضاً", "مصادر", "ملاحظات", "المصادر"]

  phases:
    embedding_alignment:        # Phase 1
      enabled: true
      datasets: ["arabic_squad"]
      trainable_parameters:
        - "embed_tokens"
        - "lm_head"
      steps: 1000
      # 5e-4 (was 1e-3): default tuned for from-scratch tokenizers whose
      # embeddings start as N(0, 0.02²) noise. For tokenizers that start
      # with pretrained embeddings (e.g. native_llama), set
      # ``training.phases.embedding_alignment.enabled: false`` in the
      # experiment YAML — Phase 1 there only damages the pretrained signal.
      learning_rate: 5.0e-4
      batch_size: 8
      gradient_accumulation_steps: 1
      optimizer: "adamw"
      weight_decay: 0.0
      max_length: 512
      loss_target: "full_sequence"
      lr_scheduler: "constant"
      warmup_steps: 0
      max_grad_norm: 1.0
      save_checkpoint: true
      clean_latin_rows: false   # drop training records containing Latin-script letters

    warmup:                     # Phase 2
      enabled: true
      datasets: ["arabic_squad"]
      trainable_parameters: ["*"]
      steps: 2000
      learning_rate: 2.0e-4
      batch_size: 4
      gradient_accumulation_steps: 4
      optimizer: "adamw"
      weight_decay: 0.01
      max_length: 512
      loss_target: "answer_only"
      lr_scheduler: "cosine"
      warmup_steps: 100
      max_grad_norm: 1.0
      save_checkpoint: true
      clean_latin_rows: false   # drop training records containing Latin-script letters

    sft:                        # Phase 3
      enabled: true
      # Mix in the synthetic MCQ corpus derived from Arabic-SQuAD so the
      # model sees the eval-time MCQ format during SFT (closes the
      # train/eval format-mismatch). The MCQ corpus is fully disjoint from
      # every eval benchmark by construction.
      datasets: ["tydiqa_arabic", "arcd", "arabic_squad_mcq"]
      trainable_parameters: ["*"]
      steps: 2000
      learning_rate: 2.0e-4
      batch_size: 4
      gradient_accumulation_steps: 4
      optimizer: "adamw"
      weight_decay: 0.01
      max_length: 512
      loss_target: "answer_only"
      lr_scheduler: "cosine"
      warmup_steps: 100
      max_grad_norm: 1.0
      save_checkpoint: true
      clean_latin_rows: false   # drop training records containing Latin-script letters
      early_stopping:
        enabled: true
        metric: "eval_loss"
        eval_every_n_steps: 200
        patience: 5
        min_delta: 5.0e-4
        min_steps_before_stop: 500
        restore_best_at_end: true
        eval_splits:
          tydiqa_arabic: "validation"
          arcd: "validation"

evaluation:
  intrinsic_metrics: true
  morphological_metrics: true
  morph_sample_size: 500
  downstream_metrics: true
  num_eval_samples: null
  generation_max_new_tokens: 128
  generation_temperature: 1.0
  generation_do_sample: false
  failure_reports: false
  score_normalization: "char+pmi"

tracking:
  use_wandb: false
  wandb_project: "arabic-tokenizer-eval"
  log_to_file: true
