# ALL-TOKENIZERS SWEEP — every from-scratch tokenizer + the native_llama
# baseline, evaluated under the same fixed 3-phase pipeline on all 4 LightEval
# benchmarks.
#
# Every flag is shown explicitly at its current default (no implicit
# inheritance from base.yaml) so this file is the one-stop place to tune
# parameters. Comments after each field document the alternatives.
#
# Run with:
#   .venv/bin/python scripts/run_experiment.py \
#       --config configs/experiments/all_tokenizers_sweep.yaml --sweep
#
# Wall-clock estimate on a single H100:
#   ~5 h per tokenizer cell (Phase 1+2+3 + 4 benchmark evals)
#   × 9 cells (default vocab per tokenizer) ≈ 45 h end-to-end
# Reduce by:
#   - dropping cells from sweep.tokenizers
#   - sft.enabled: false       → ~1.5 h per cell (no-SFT baseline)
#   - num_eval_samples: 500    → caps each benchmark for fast iteration

# ---------------------------------------------------------------------------
# Top-level experiment metadata
# ---------------------------------------------------------------------------
experiment:
  name: "all_tokenizers_sweep"
  output_dir: "outputs/experiments/all_tokenizers_sweep"
  description: "Full sweep over all 9 tokenizers under the 3-phase pipeline."
  seed: 42                                             # master RNG seed (data shuffles, init, etc.)
  deterministic: true                                  # torch.backends.cudnn.deterministic=true


# ---------------------------------------------------------------------------
# Main Arabic corpus (used for tokenizer training + intrinsic metrics)
# ---------------------------------------------------------------------------
data:
  dataset_name: "Jr23xd23/ArabicText-Large"            # HF dataset id
  dataset_config: null                                 # null = default config
  cache_dir: "outputs/data_cache"
  train_split: "train"
  eval_split: "test"
  max_train_samples: null                              # null = all rows
  max_eval_samples: 10000                              # cap for intrinsic eval texts
  preprocessing:
    normalize_unicode: true                            # NFKC normalization
    remove_diacritics: false                           # tashkeel removal
    min_text_length: 10                                # drop rows shorter than this


# ---------------------------------------------------------------------------
# Tokenizer — top-level acts as a default; per-cell `sweep.tokenizers`
# entries override it. Kept here so single-cell runs without --sweep still
# work.
# ---------------------------------------------------------------------------
tokenizer:
  type: "native_llama"
  vocab_size: null
  load_path: null                                      # set to skip training and reuse a saved tokenizer
  save_path: "outputs/tokenizers/native_llama"
  params: {}


# ---------------------------------------------------------------------------
# Model — fixed across every cell. The only experimental variable is the
# tokenizer (and its derived embedding layout).
# ---------------------------------------------------------------------------
model:
  type: "llama"                                        # registry key
  name_or_path: "meta-llama/Llama-3.2-1B"              # gated; needs HF_TOKEN
  dtype: "bfloat16"
  device: "auto"                                       # "auto" | "cuda:0" | "cpu"
  params: {}


# ---------------------------------------------------------------------------
# Training — the 3-phase pipeline
# ---------------------------------------------------------------------------
training:
  bf16: true                                           # mixed-precision dtype (applies to all phases)
  fp16: false
  logging_steps: 50                                    # log frequency inside each phase

  phases:

    # =====================================================================
    # Phase 1 — Embedding Alignment
    # ---------------------------------------------------------------------
    # Body frozen; only embed_tokens + lm_head trainable. Aligns randomly-
    # initialized embeddings (from-scratch tokenizers) with the Arabic
    # distribution. Set ``enabled: false`` for native_llama if you don't want
    # to perturb pretrained embeddings — but note this is normally kept on
    # to preserve budget parity across conditions.
    # =====================================================================
    embedding_alignment:
      enabled: true                                    # per-phase on/off
      datasets: ["arabic_squad"]                       # arabic_squad | tydiqa_arabic | arcd | arabic_squad_mcq
      trainable_parameters:                            # substring match against named_parameters
        - "embed_tokens"
        - "lm_head"
                                                       # ["*"] alone = all parameters
      steps: 1000                                      # fixed step budget (NOT epochs)
      learning_rate: 5.0e-4                            # high LR — only embeddings update
      batch_size: 8
      gradient_accumulation_steps: 1                   # effective batch = batch_size × grad_accum
      optimizer: "adamw"                               # only adamw supported
      weight_decay: 0.0                                # spec: no weight decay on embeddings
      max_length: 512                                  # tokenizer truncation
      loss_target: "full_sequence"                     # "full_sequence" | "answer_only"
      lr_scheduler: "constant"                         # "cosine" | "constant" | "linear"
      warmup_steps: 0                                  # linear warmup before scheduler
      max_grad_norm: 1.0                               # gradient clipping
      save_checkpoint: true                            # writes {output_dir}/training/embedding_alignment/
      clean_latin_rows: true                          # drop training records whose question/context/answer/choices contain any Latin-script letter

    # =====================================================================
    # Phase 2 — Warmup
    # ---------------------------------------------------------------------
    # Unfreeze everything; continue on the translated Arabic-SQuAD corpus.
    # Answer-only loss to teach QA format on a regular, well-formed dataset
    # before exposure to native Arabic complexity in Phase 3.
    # =====================================================================
    warmup:
      enabled: true
      datasets: ["arabic_squad"]
      trainable_parameters: ["*"]                      # all parameters
      steps: 2000
      learning_rate: 2.0e-5
      batch_size: 4
      gradient_accumulation_steps: 4                   # effective batch = 16
      optimizer: "adamw"
      weight_decay: 0.01
      max_length: 512
      loss_target: "answer_only"                       # mask context + question
      lr_scheduler: "cosine"
      warmup_steps: 100
      max_grad_norm: 1.0
      save_checkpoint: true
      clean_latin_rows: true                          # drop training records whose question/context/answer/choices contain any Latin-script letter

    # =====================================================================
    # Phase 3 — SFT (Supervised Fine-Tuning)
    # ---------------------------------------------------------------------
    # The decisive phase: native Arabic QA on TyDiQA-Arabic + ARCD, plus
    # synthetic MCQ derived from Arabic-SQuAD so the model sees the eval-time
    # MCQ format during SFT. Periodic eval on TyDiQA + ARCD val splits drives
    # stagnation early-stop. Set ``enabled: false`` for the no-SFT baseline.
    # =====================================================================
    sft:
      enabled: true
      datasets:                                        # multi-corpus — concatenated + shuffled
        - "tydiqa_arabic"
        - "arcd"
        - "arabic_squad_mcq"                           # synthetic MCQ teaching the eval format
      trainable_parameters: ["*"]
      steps: 2000
      learning_rate: 2.0e-5
      batch_size: 4
      gradient_accumulation_steps: 4
      optimizer: "adamw"
      weight_decay: 0.01
      max_length: 512
      loss_target: "answer_only"
      lr_scheduler: "cosine"
      warmup_steps: 100
      max_grad_norm: 1.0
      save_checkpoint: true
      clean_latin_rows: true                          # drop training records whose question/context/answer/choices contain any Latin-script letter
      early_stopping:
        enabled: true                                  # required when sft.enabled=true
        metric: "eval_loss"                            # only "eval_loss" supported
        eval_every_n_steps: 200                        # run eval at every Nth step
        patience: 5                                    # stop after N evals without improvement
        min_delta: 5.0e-4                              # improvements smaller than this = noise
        min_steps_before_stop: 500                     # don't allow early-stop before this step
        restore_best_at_end: true                      # snapshot best weights, restore at end
        eval_splits:                                   # which val split per corpus
          tydiqa_arabic: "validation"
          arcd: "validation"


# ---------------------------------------------------------------------------
# Evaluation
# ---------------------------------------------------------------------------
evaluation:
  intrinsic_metrics: true                              # fertility / compression / UNK / coverage
  morphological_metrics: true                          # Arabic root / pattern / morpheme metrics
  morph_sample_size: 500                               # # of distinct words to sample
  downstream_metrics: true                             # run task.evaluate()
  num_eval_samples: null                               # null = full benchmark; integer to cap
  failure_reports: true                                # writes per-task CSV of wrong answers
  intrinsic_unk_report: true                          # dumps per-word UNK list -> intrinsic_unks.csv
  downstream_unk_report: true                         # dumps per-task UNK list -> unk_reports/<task>_unks.csv
  score_normalization: "char+pmi"                      # "char" | "pmi" | "char+pmi"


# ---------------------------------------------------------------------------
# Sweep — all 9 tokenizers × all 4 eval benchmarks
# ---------------------------------------------------------------------------
# Training happens ONCE per (tokenizer, vocab_size) cell. Each cell's
# trained model is evaluated on every task in ``sweep.tasks``.
#
# Vocab sizes: subword tokenizers (bpe / wordpiece / morpho_bpe) support
# 16K/32K/50K — only 32K listed by default to keep wall-time manageable;
# uncomment the others for the full grid. Character/byte/native/araroopat
# tokenizers ignore vocab_size (vocab is derived).
# ---------------------------------------------------------------------------
sweep:
  tokenizers:

    # ---- 1. BPE ----
    - type: "bpe"
      vocab_sizes: [32000]                             # add 16000 / 50000 for the full subword grid
      params:
        min_frequency: 2                               # drop pieces with corpus freq below this

    # ---- 2. WordPiece ----
    - type: "wordpiece"
      vocab_sizes: [32000]
      params:
        min_frequency: 2

    # ---- 3. Morphological BPE (Farasa pre-segmentation + BPE) ----
    # Requires Java runtime for the Farasa subprocess.
    - type: "morpho_bpe"
      vocab_sizes: [32000]
      params:
        min_frequency: 2

    # ---- 4. CharacterBERT (word-level units + CharCNN embedding) ----
    - type: "character_bert"
      vocab_sizes: [null]                              # char vocab derived from data
      params:
        max_char_len: 50                               # pad/truncate each word to this many chars
        max_word_vocab: 50000                          # output-head vocab over words

    # ---- 5. char-JABER (single character per token) ----
    - type: "char_jaber"
      vocab_sizes: [null]
      params: {}

    # ---- 6. Farasa-CharacterBERT (Farasa segmentation + CharCNN on morphemes) ----
    # Requires Java runtime for the Farasa subprocess.
    - type: "farasa_character_bert"
      vocab_sizes: [null]
      params:
        max_char_len: 25                               # morphemes shorter than full words
        max_word_vocab: 50000                          # output-head vocab over morphemes

    # ---- 7. Charformer (byte-level + GBST learned blocks) ----
    # Fixed 260-token vocab (256 bytes + 4 specials). Hyperparameters control
    # the GBST module inside the model (not the tokenizer file itself).
    - type: "charformer"
      vocab_sizes: [null]
      params:
        max_block_size: 4                              # M: enumerate block sizes 1..M
        downsample_rate: 2                             # d_s: final mean-pool stride
        conv_kernel_size: 5                            # pre-GBST 1D conv kernel; 0 disables
        block_attention: false                         # position-wise score calibration

    # ---- 8. AraRooPat (Arabic Roots & Patterns via CAMeL Tools) ----
    # Requires the .venv-camel subprocess bridge. One-time setup:
    #   python -m venv .venv-camel
    #   .venv-camel/bin/pip install -e ".[araroopat-camel]"
    #   .venv-camel/bin/camel_data -i light
    - type: "araroopat"
      vocab_sizes: [null]                              # derived from max_roots + max_patterns
      params:
        max_roots: 10000                               # 5000 / 10000 / 15000 = Compact / Balanced / Max
        max_patterns: 500                              # 200 / 500 / 1000
        min_root_freq: 2
        min_pattern_freq: 2
        generator_timeout_ms: 50                       # tier-2 CAMeL Generator wall-clock cap
        use_diacritized_surface: false                 # lookup table surface form
        cache_corpus_analysis: true                    # cache CAMeL pre-pass to disk

  tasks:
    # 3 LightEval log-likelihood MCQ benchmarks.
    - type: "acva"
      params:
        max_length: 512
        seed: 42
        clean_latin_rows: true                        # filter Latin-script rows before eval
        # dataset_name: "OALL/ACVA"                    # override the default HF id if needed
        # dataset_config: null

    - type: "alghafa"
      params:
        max_length: 512
        seed: 42
        clean_latin_rows: true
        # dataset_name: "OALL/AlGhafa-Arabic-LLM-Benchmark-Native"

    - type: "arabic_exam"
      params:
        max_length: 512
        seed: 42
        clean_latin_rows: true
        # dataset_name: "MBZUAI/ArabicMMLU"


# ---------------------------------------------------------------------------
# Tracking (optional — wandb integration)
# ---------------------------------------------------------------------------
tracking:
  use_wandb: false
  wandb_project: "arabic-tokenizer-eval"
  wandb_entity: null
  log_to_file: true
