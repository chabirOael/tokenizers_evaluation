# The fair comparator for arm B v3 (2026-09-22): the SAME pipeline, budget, pool and embedding initialisation as
# qwen_araroopat_3phase_v3.yaml with a plain from-scratch byte-level BPE at vocab 16 000 (configs/tokenizers/bpe.yaml,
# trained in-run on the same corpus and preprocessing). Native Qwen is the ceiling of qwen_native_vs_araroopat, not
# the control: it never had its vocabulary swapped. This cell asks the platform's actual question — does a
# morphology-aware vocabulary beat a frequency-driven one at equal adaptation? Free-form eval only, like arm B.
# Differences from the AraRooPat file: tokenizer type / vocab_size / save_path / params (load_path null: BPE trains in
# ~2 min); embedding_init surface_avg works unchanged — BaseTokenizer.token_surfaces gives every BPE piece its own
# decoded string (a lone byte of a multi-byte letter has none and gets the global-mean row). The 16 K BPE packs
# 1.75 tokens per pool word (measured 2026-09-22 on 1 800 pool docs) against AraRooPat's 2.97, so the 50 M-word pool
# of v3 would hold only ~87 M tokens against the 126 M raw + 4.9 M QA the phases draw: this cell has its own
# 80 M-word pool (~140 M tokens, a new fingerprint — build ~15 min with HF_TOKEN, pack minutes for an HF tokenizer).
# Equal compute (131 M tokens), not equal text — the platform's stated convention for cross-tokenizer budgets.
# Phase 3: the same mixture 30 000 at 40/30/30; drop_truncated_answers + upsample kept for parity (BPE truncates
# fewer records than AraRooPat at max_length 512, so fewer repeats).
experiment:
  name: bpe_16k_3phase_v3
  description: Qwen3-4B-Base + from-scratch BPE 16 000 with surface-average embedding init, Phase 1 32.8 M + Phase 2
    98.3 M mix tokens on the 50 M-word pool at LR 5e-4 / 2e-5, Phase 3 mixture 30 000 at LR 2e-5 with
    drop_truncated_answers + upsample, free-form eval at 2 400 chars — the equal-adaptation comparator of arm B v3
  output_dir: outputs/experiments/qwen_native_vs_araroopat/bpe_16k_3phase_v3
  seed: 42
  deterministic: true
  created_at: "2026-09-22T02:55:00+00:00"
  runs: []

data:
  # Tokenizer-training corpus preprocessing (base.yaml defaults, stated because they key the CAMeL cache):
  preprocessing:
    normalize_unicode: true
    remove_diacritics: false
    normalize_alef: false        # off since 2026-09-16: the fold rewrote 13 % of words into spellings no eval text uses
    remove_tatweel: true
    min_text_length: 10
    join_lone_waw: true

tokenizer:
  type: bpe
  vocab_size: 16000
  save_path: outputs/tokenizers/bpe_16k_v3
  load_path: null                # trained in-run on the same corpus split + preprocessing as the AraRooPat v3 tokenizer (~2 min)
  params: &bpe_params            # configs/tokenizers/bpe.yaml
    min_frequency: 2

model:
  type: qwen3
  name_or_path: Qwen/Qwen3-4B-Base
  dtype: bfloat16
  device: auto
  embedding_init:                # the probe's winner (see header); legacy = the resize's first-17 074-rows mapping of v2
    method: surface_avg
    base_tokenizer: null         # = model.name_or_path
    weighting: char_len
    norm: none
    seed: 42

training:
  pretraining_mix:
    pool:
      total_words: 80000000      # BPE-16K: 1.75 tokens/word → ~140 M tokens; the two phases below draw 131 M (own pool fingerprint)
  corpus_params:
    aya_ar:
      include_datasets: ["Aya-Dataset", "Dolly-v2 (T)"]   # the two free-form sub-datasets of standard_arabic
  phases:
    embedding_alignment:         # Phase 1: new embeddings + tied lm_head on raw text, body frozen
      enabled: true
      datasets: [pretraining_mix]
      trainable_parameters: [embed_tokens, lm_head]
      steps: 8000                # micro-steps = updates at accumulation 1 (v2: 4 000)
      mix_tokens: 32768000       # 8 000 × 8 × 512 — blocks [0, 64000) of the packed corpus
      learning_rate: 5.0e-4      # embeddings only: the higher rate is safe here
      batch_size: 8
      gradient_accumulation_steps: 1
      max_length: 512
      loss_target: full_sequence
      lr_scheduler: constant
      warmup_steps: 0
    warmup:                      # Phase 2: whole model on raw text + 7 % QA-format blend
      enabled: true
      datasets: [pretraining_mix]
      trainable_parameters: ["*"]
      steps: 48000               # micro-steps; 12 000 updates at accumulation 4 (v2: 10 000 / 2 500)
      mix_tokens: 98304000       # 48 000 × 4 × 512 — 182 400 raw blocks from [64000, …) + 9 600 QA-blend blocks
      learning_rate: 2.0e-5      # full fine-tuning of a 4B model (was 2e-4 — destructive, see header)
      batch_size: 4
      gradient_accumulation_steps: 4
      max_length: 512
      loss_target: full_sequence
      lr_scheduler: cosine       # horizon 12 000 updates
      warmup_steps: 400          # micro-steps = 100 updates
      qa_blend:
        datasets: [tydiqa_arabic, arcd]
        share: 0.05                # v2 had 0.07 of 20.5 M tokens (2 800 blocks); 0.07 of 98.3 M = 13 440 blocks exceeds the packed
                                   # TyDiQA + ARCD train corpus (10 396 blocks, 5.3 M tokens) and the packer never wraps — the first
                                   # v3 attempt died here after Phase 1. 0.05 = 9 600 blocks = one pass over the QA corpus.
        split: train
        seed: 42
    sft:                         # Phase 3: identical to qwen_native_sft_only.yaml except drop_truncated_answers + upsample (see header)
      enabled: true
      datasets: [tydiqa_arabic, arcd, arabic_squad_mcq, cidar, bactrian_x_ar, aya_ar]
      trainable_parameters: ["*"]
      mixture:
        total_examples: 30000
        shares: {extractive: 0.40, mcq: 0.30, free_form: 0.30}
        within_category: equal
        upsample: true             # parity with arm B v3 (a shortfall is unlikely under BPE — fewer truncations at max_length 512)
        drop_truncated_answers: true
        seed: 42
      steps: null                # derived: 30 000 / 4 = 7 500 micro-steps (early stop may end it sooner)
      learning_rate: 2.0e-5
      batch_size: 4
      gradient_accumulation_steps: 4
      max_length: 512
      loss_target: answer_only
      lr_scheduler: cosine       # horizon 1 875 updates
      warmup_steps: 400          # micro-steps = 100 updates
      early_stopping:
        enabled: true
        eval_every_n_steps: 200
        patience: 5
        min_delta: 5.0e-4
        min_steps_before_stop: 500
        restore_best_at_end: true
        eval_splits: {tydiqa_arabic: dev, arcd: dev}   # extractive-only signal (a free-form dev slice is the planned next change)

evaluation:
  intrinsic_metrics: true
  morphological_metrics: true
  downstream_metrics: true
  eval_row_dump: true
  score_normalization: char+pmi
  num_fewshot: 3                 # unused by freeform_cidar; kept so adding the MCQ tasks later changes nothing else

sweep:
  tokenizers:
    - type: bpe                  # == tokenizer.type above; one cell → no --sweep, this list is informational
      vocab_sizes: [16000]
      params: *bpe_params
  tasks:
    - type: freeform_cidar
      params: {max_output_chars: 2400}   # pinned: the fixed decoding rule of the reference cells (code default since 2026-09-21)
