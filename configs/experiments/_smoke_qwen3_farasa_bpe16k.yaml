# SMOKE (tokenizer benchmark, brief 2026-11-08 §6.3) — generated from qwen_farasa_bpe16k_3phase_v5_distill.yaml by
# outputs/experiments/_tokenizer_benchmark/m5/make_smokes.py: 30 / 32 / 30 micro-steps, a 60-example mixture,
# 10 free-form prompts; the same pools (fingerprints), tokenizer, QA-blend share and checkpoint.
experiment:
  name: _smoke_qwen3_farasa_bpe16k
  description: 'SMOKE of qwen_farasa_bpe16k_3phase_v5_distill.yaml (tokenizer benchmark, brief 2026-11-08 §6.3): 30 / 32 /
    30 micro-steps, a 60-example mixture, 10 free-form prompts'
  output_dir: outputs/experiments/_smoke_qwen3_farasa_bpe16k
  seed: 42
  deterministic: true
  runs:
    - {started_at: "2026-11-08T12:47:13+00:00", run_id: "20261108-124713__smoke_qwen3_farasa_bpe16k", source: console}
data:
  preprocessing:
    normalize_unicode: true
    remove_diacritics: false
    normalize_alef: false
    remove_tatweel: true
    min_text_length: 10
    join_lone_waw: true
tokenizer:
  type: farasa_bpe
  vocab_size: 16000
  save_path: outputs/tokenizers/farasa_bpe_16k_v1a
  load_path: outputs/tokenizers/farasa_bpe_16k_v1a
  params: &id001
    min_frequency: 2
    inference_segmentation: farasa
model:
  type: qwen3
  name_or_path: Qwen/Qwen3-4B-Base
  dtype: bfloat16
  device: auto
  embedding_init:
    method: surface_avg
    base_tokenizer: null
    weighting: char_len
    norm: none
    seed: 42
training:
  pretraining_mix:
    pool:
      total_words: 80000000
  corpus_params:
    cidar:
      teacher_answers: outputs/data_cache/distill/aya_expanse_32b_v1/teacher_answers_v1.jsonl
    bactrian_x_ar:
      teacher_answers: outputs/data_cache/distill/aya_expanse_32b_v1/teacher_answers_v1.jsonl
    aya_ar:
      include_datasets:
      - Aya-Dataset
      - Dolly-v2 (T)
      teacher_answers: outputs/data_cache/distill/aya_expanse_32b_v1/teacher_answers_v1.jsonl
  phases:
    embedding_alignment:
      enabled: true
      datasets:
      - pretraining_mix
      trainable_parameters:
      - embed_tokens
      - lm_head
      steps: 30
      mix_tokens: 122880
      learning_rate: 0.0005
      batch_size: 8
      gradient_accumulation_steps: 1
      max_length: 512
      loss_target: full_sequence
      lr_scheduler: constant
      warmup_steps: 0
    warmup:
      enabled: true
      datasets:
      - pretraining_mix
      trainable_parameters:
      - '*'
      steps: 32
      mix_tokens: 65536
      learning_rate: 2.0e-05
      batch_size: 4
      gradient_accumulation_steps: 4
      max_length: 512
      loss_target: full_sequence
      lr_scheduler: cosine
      warmup_steps: 4
      qa_blend:
        datasets:
        - tydiqa_arabic
        - arcd
        share: 0.035
        split: train
        seed: 42
    sft:
      enabled: true
      datasets:
      - tydiqa_arabic
      - arcd
      - arabic_squad_mcq
      - cidar
      - bactrian_x_ar
      - aya_ar
      trainable_parameters:
      - '*'
      mixture:
        total_examples: 60
        shares:
          extractive: 0.25
          mcq: 0.15
          free_form: 0.6
        within_category: equal
        upsample: true
        drop_truncated_answers: true
        seed: 42
      steps: null
      learning_rate: 2.0e-05
      batch_size: 2
      gradient_accumulation_steps: 8
      max_length: 1024
      loss_target: answer_only
      lr_scheduler: cosine
      warmup_steps: 4
      early_stopping:
        enabled: true
        eval_every_n_steps: 15
        patience: 5
        min_delta: 0.0005
        min_steps_before_stop: 10
        restore_best_at_end: true
        eval_splits: null
        eval_mixture:
          total_examples: 20
          seed: 42
evaluation:
  intrinsic_metrics: true
  morphological_metrics: true
  downstream_metrics: true
  eval_row_dump: true
  score_normalization: char+pmi
  num_fewshot: 3
  num_eval_samples: 10
sweep:
  tokenizers:
  - type: farasa_bpe
    vocab_sizes:
    - 16000
    params: *id001
  tasks:
  - type: freeform_cidar
    params:
      max_output_chars: 2400
