# SMOKE (brief v6 §5.2) — generated from models_x_tokenizers/gemma3_4b_native_sft_v5_distill.yaml: 30 / 32 / 30 micro-steps, a
# 60-example mixture, 10 free-form prompts; the same pools (fingerprints), tokenizer and Gemma-3-4B checkpoint.
experiment:
  name: _smoke_gemma3_native
  description: 'SMOKE of gemma3_4b_native_sft_v5_distill.yaml (brief v6 §5.2): 30 micro-steps per phase, a 60-example mixture,
    10 free-form prompts'
  output_dir: outputs/experiments/_smoke_gemma3_native
  seed: 42
  deterministic: true
  runs:
    - {started_at: "2026-10-10T01:40:23+00:00", run_id: "20261010-014023__smoke_gemma3_native", source: console}
tokenizer:
  type: native_gemma
  load_path: null
  save_path: outputs/tokenizers/native_gemma3_4b
  params:
    model_name_or_path: google/gemma-3-4b-pt
model:
  type: gemma3
  name_or_path: google/gemma-3-4b-pt
  dtype: bfloat16
  device: auto
training:
  corpus_params:
    cidar:
      teacher_answers: outputs/data_cache/distill/aya_expanse_32b_v1/teacher_answers_v1.jsonl
    bactrian_x_ar:
      teacher_answers: outputs/data_cache/distill/aya_expanse_32b_v1/teacher_answers_v1.jsonl
    aya_ar:
      include_datasets:
      - Aya-Dataset
      - Dolly-v2 (T)
      teacher_answers: outputs/data_cache/distill/aya_expanse_32b_v1/teacher_answers_v1.jsonl
  phases:
    embedding_alignment:
      enabled: false
    warmup:
      enabled: false
    sft:
      enabled: true
      datasets:
      - tydiqa_arabic
      - arcd
      - arabic_squad_mcq
      - cidar
      - bactrian_x_ar
      - aya_ar
      trainable_parameters:
      - '*'
      mixture:
        total_examples: 60
        shares:
          extractive: 0.25
          mcq: 0.15
          free_form: 0.6
        within_category: equal
        upsample: true
        drop_truncated_answers: true
        seed: 42
      steps: null
      learning_rate: 2.0e-05
      batch_size: 2
      gradient_accumulation_steps: 8
      max_length: 1024
      loss_target: answer_only
      lr_scheduler: cosine
      warmup_steps: 4
      early_stopping:
        enabled: true
        eval_every_n_steps: 15
        patience: 5
        min_delta: 0.0005
        min_steps_before_stop: 10
        restore_best_at_end: true
        eval_splits: null
        eval_mixture:
          total_examples: 20
          seed: 42
evaluation:
  intrinsic_metrics: true
  morphological_metrics: true
  downstream_metrics: true
  eval_row_dump: true
  score_normalization: char+pmi
  num_fewshot: 3
  num_eval_samples: 10
sweep:
  tokenizers:
  - type: native_gemma
    vocab_sizes:
    - null
    params:
      model_name_or_path: google/gemma-3-4b-pt
  tasks:
  - type: freeform_cidar
    params:
      max_output_chars: 2400
