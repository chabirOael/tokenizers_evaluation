# Qwen3-4B-Base + native_qwen3 tokenizer — Phase 2 only (Phase 1 + 3 off).
#
# Companion to qwen3_4b_3phase_with_sft.yaml, mirroring the
# native_llama_3phase_no_sft.yaml shape: Phase 1 disabled (pretrained
# embeddings), Phase 3 disabled so the model never sees TyDiQA-Arabic +
# ARCD. Isolates the (Phase 2 vs Phase 2 + Phase 3) delta on Qwen3-4B.
#
# All other phase parameters inherit from configs/base.yaml.

experiment:
  name: "qwen3_4b_3phase_no_sft"
  output_dir: "outputs/experiments/qwen3_4b_3phase_no_sft"
  seed: 42

tokenizer:
  type: "native_qwen3"
  vocab_size: null
  load_path: null
  save_path: "outputs/tokenizers/native_qwen3_4b"
  params:
    model_name_or_path: "Qwen/Qwen3-4B-Base"

model:
  type: "qwen3"
  name_or_path: "Qwen/Qwen3-4B-Base"
  dtype: "bfloat16"
  device: "auto"

training:
  phases:
    embedding_alignment:
      enabled: false
    sft:
      enabled: false

sweep:
  tokenizers:
    - type: "native_qwen3"
      vocab_sizes: [null]
  tasks:
    - type: "acva"
      params:
        num_fewshot: 0   # ACVA: 0-shot (T/F task — few-shot hurts under PMI)
    - type: "alghafa"
      params: {}
    - type: "arabic_exam"
      params: {}

evaluation:
  intrinsic_metrics: true
  morphological_metrics: true
  morph_sample_size: 500
  downstream_metrics: true
  failure_reports: true
  score_normalization: "char+pmi"
  num_fewshot: 3            # 3-shot in-context demos per LightEval MCQ row
  num_eval_samples: null
