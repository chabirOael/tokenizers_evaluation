# MCQ benchmarks under the fixed scorer (2026-09-24, docs/report.md §3.9 / §3.10): the untouched
# Qwen3-4B-Base (the base every arm starts from).
# Eval only — every phase disabled, model.name_or_path = Qwen/Qwen3-4B-Base, the tokenizer block = the
# native Qwen3 wrapper (as native_qwen3_base_m2_c2400).
# One protocol for the six files of this folder (only experiment / tokenizer / model.name_or_path /
# sweep.tokenizers differ): acva 0-shot, alghafa / arabic_exam / culture_arabic_mmlu 3-shot, max_length 4096
# for every task (so no row truncates except the same long Arabic-Exam passages for every tokenizer),
# score_normalization char+pmi, per-row dumps on (cont_tokens = the scored window), intrinsic metrics on
# (MEI needs RPS and compression). The primary comparison is on the rows no cell truncates
# (scripts/mcq_compare.py); the full-benchmark numbers are secondary.
experiment:
  name: native_qwen3_base_mcq4096
  description: untouched Qwen3-4B-Base + native tokenizer (no phases) — ACVA / Alghafa / Arabic-Exam / Culture-MMLU,
    fixed scorer, max_length 4096
  output_dir: outputs/experiments/qwen_native_vs_araroopat/native_qwen3_base_mcq4096
  seed: 42
  deterministic: true
  created_at: '2026-09-24T11:34:18+00:00'
  runs:
    - {started_at: "2026-09-24T20:02:56+00:00", run_id: mcq_v5_chain_mcq_native_base, source: cli}
tokenizer:
  type: native_qwen3
  vocab_size: null
  params:
    model_name_or_path: Qwen/Qwen3-4B-Base
  save_path: outputs/tokenizers/native_qwen3_4b
  load_path: null
model:
  type: qwen3
  name_or_path: Qwen/Qwen3-4B-Base
  dtype: bfloat16
  device: auto
training:
  phases:
    embedding_alignment:
      enabled: false
    warmup:
      enabled: false
    sft:
      enabled: false
evaluation:
  intrinsic_metrics: true
  morphological_metrics: true
  downstream_metrics: true
  eval_row_dump: true
  score_normalization: char+pmi
  num_fewshot: 3
sweep:
  tokenizers:
  - type: native_qwen3
    vocab_sizes:
    - null
    params:
      model_name_or_path: Qwen/Qwen3-4B-Base
  tasks:
  - type: acva
    params:
      num_fewshot: 0
      max_length: 4096
  - type: alghafa
    params:
      max_length: 4096
  - type: arabic_exam
    params:
      max_length: 4096
  - type: culture_arabic_mmlu
    params:
      max_length: 4096
