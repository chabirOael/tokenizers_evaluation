# Budget ablation arm, superseded 2026-09-21: 2400 became the default (rule: at 2400 six of the
# control's 12 cap rows end in EOS, none loops, the wall grows ×1.4), so the cell this file produced
# now sits in `outputs/experiments/qwen_native_vs_araroopat/_superseded/`. Re-running it writes a
# fresh 1200-budget cell next to the reference cells.
# Control under the 2026-09-21 decoding rules: the untouched Qwen3-4B-Base with its native
# tokenizer, no training at all (every phase disabled), free-form eval only, stop markers v2
# (the templates' exact section labels — a bare `\n###` cut the model's own sub-headers) at a
# 1200-character budget (`sweep.tasks[].params`, the only place the pipeline reads it from).
# Cell folder under the qwen_native_vs_araroopat experiment dir, next to the older rule sets.
experiment:
  name: native_qwen3_base_m2_c1200
  description: "Qwen3-4B-Base + native tokenizer, untrained control (no phases), free-form eval only — stop markers v2 (exact template labels), 1200-char budget"
  output_dir: outputs/experiments/qwen_native_vs_araroopat/native_qwen3_base_m2_c1200
  created_at: "2026-09-21T09:05:24+00:00"
  seed: 42
  deterministic: true
  runs:
    - {started_at: "2026-09-21T09:06:38+00:00", run_id: "20260921-090638_qwen_native_base_m2_c1200", source: console}
data:
  dataset_name: Jr23xd23/ArabicText-Large
  dataset_config: null
  cache_dir: outputs/data_cache
  train_split: train
  eval_split: test
  max_train_samples: null
  max_eval_samples: 10000
  preprocessing:
    normalize_unicode: true
    remove_diacritics: false
    normalize_alef: false
    remove_tatweel: true
    min_text_length: 10
    join_lone_waw: true
tokenizer:
  type: native_qwen3
  vocab_size: null
  params:
    model_name_or_path: Qwen/Qwen3-4B-Base
  save_path: outputs/tokenizers/native_qwen3_4b
  load_path: null
model:
  type: qwen3
  name_or_path: Qwen/Qwen3-4B-Base
  dtype: bfloat16
  device: auto
  params: {}
task:
  type: text_generation
  params:
    max_length: 512
training:
  phases:
    embedding_alignment:
      enabled: false
      datasets:
      - arabic_squad
      trainable_parameters:
      - embed_tokens
      - lm_head
      steps: 1000
      mix_tokens: null
      learning_rate: 0.0005
      batch_size: 8
      gradient_accumulation_steps: 1
      optimizer: adamw
      weight_decay: 0.0
      max_length: 512
      loss_target: full_sequence
      lr_scheduler: constant
      warmup_steps: 0
      max_grad_norm: 1.0
      save_checkpoint: true
      clean_latin_rows: false
      qa_blend: null
      mixture: null
      early_stopping: null
    warmup:
      enabled: false
      datasets:
      - arabic_squad
      trainable_parameters:
      - '*'
      steps: 2000
      mix_tokens: null
      learning_rate: 0.0002
      batch_size: 4
      gradient_accumulation_steps: 4
      optimizer: adamw
      weight_decay: 0.01
      max_length: 512
      loss_target: answer_only
      lr_scheduler: cosine
      warmup_steps: 100
      max_grad_norm: 1.0
      save_checkpoint: true
      clean_latin_rows: false
      qa_blend: null
      mixture: null
      early_stopping: null
    sft:
      enabled: false
      datasets:
      - tydiqa_arabic
      - arcd
      - arabic_squad_mcq
      - cidar
      - bactrian_x_ar
      - aya_ar
      trainable_parameters:
      - '*'
      steps: 7500
      mix_tokens: null
      learning_rate: 0.0002
      batch_size: 4
      gradient_accumulation_steps: 4
      optimizer: adamw
      weight_decay: 0.01
      max_length: 512
      loss_target: answer_only
      lr_scheduler: cosine
      warmup_steps: 100
      max_grad_norm: 1.0
      save_checkpoint: true
      clean_latin_rows: false
      qa_blend: null
      mixture:
        total_examples: 30000
        shares:
          extractive: 0.4
          mcq: 0.3
          free_form: 0.3
        within_category: equal
        weights: null
        upsample: false
        drop_truncated_answers: false
        seed: 42
      early_stopping:
        enabled: true
        metric: eval_loss
        eval_every_n_steps: 200
        patience: 5
        min_delta: 0.0005
        min_steps_before_stop: 500
        restore_best_at_end: true
        eval_splits:
          tydiqa_arabic: dev
          arcd: dev
  bf16: true
  fp16: false
  logging_steps: 50
  pretraining_mix:
    block_size: 512
    seed: 42
    cache_dir: outputs/data_cache/pretraining_mix
    normalization:
      nfkc: true
      remove_tatweel: true
      normalize_alef: false
      remove_diacritics: false
    sources:
    - name: fineweb2_arb
      share: 0.7
      params:
        config: arb_Arab
        min_language_score: 0.8
    - name: wikipedia_ar
      share: 0.2
      params:
        dump: 20231101.ar
        skip_title_prefixes:
        - قائمة
    - name: arabicweb24
      share: 0.1
      params: {}
    pool:
      total_words: 20000000
      stream_shuffle_buffer: 10000
      max_stream_docs_per_source: 3000000
    dedup:
      paragraph_exact: true
      minhash:
        enabled: true
        num_perm: 128
        shingle_words: 5
        threshold: 0.8
      priority:
      - wikipedia_ar
      - fineweb2_arb
      - arabicweb24
    msa_filter:
      heuristic:
        enabled: true
        max_markers_per_1k_words: 8.0
        min_markers: 3
        min_distinct_markers: 2
      camel_did:
        enabled: false
        sentences_per_doc: 8
        min_sentence_words: 5
        min_msa_share: 0.3
    quality:
      min_words: 50
      max_words: 3000
      strip_latin_parentheticals: true
      max_latin_letter_ratio: 0.05
      min_arabic_letter_ratio: 0.7
      max_short_line_ratio: 0.5
      short_line_words: 5
      max_dup_line_ratio: 0.3
      max_symbol_ratio: 0.1
      wikipedia_strip_sections:
      - المراجع
      - مراجع
      - وصلات خارجية
      - انظر أيضا
      - انظر أيضًا
      - انظر أيضاً
      - مصادر
      - ملاحظات
      - المصادر
    heldout_filter:
      enabled: true
      sets_file: configs/contamination/heldout_sets.yaml
  corpus_params:
    aya_ar:
      include_datasets:
      - Aya-Dataset
      - Dolly-v2 (T)
  contamination_exclusions: configs/contamination/exclusions.json
evaluation:
  intrinsic_metrics: true
  morphological_metrics: true
  morph_sample_size: 500
  downstream_metrics: true
  num_eval_samples: null
  generation_max_new_tokens: 128
  generation_temperature: 1.0
  generation_do_sample: false
  failure_reports: false
  intrinsic_unk_report: false
  downstream_unk_report: false
  eval_row_dump: true
  score_normalization: char+pmi
  num_fewshot: 3
tracking:
  use_wandb: false
  wandb_project: arabic-tokenizer-eval
  wandb_entity: null
  log_to_file: true
sweep:
  tokenizers:
  - type: native_qwen3
    vocab_sizes:
    - null
    params:
      model_name_or_path: Qwen/Qwen3-4B-Base
  tasks:
  - type: freeform_cidar
    params: {max_output_chars: 1200}
