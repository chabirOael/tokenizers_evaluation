# Farasa-BPE-16K (ours, MorphBPE-style) arm of the tokenizer benchmark on free-form generation (brief 2026-11-08; docs/report.md §3.18):
# Qwen3-4B-Base through the identical pipeline as every trained arm, in ONE run with the three phases enabled —
# generated from configs/experiments/qwen_bpe128k_3phase_v5_distill.yaml by
# outputs/experiments/_tokenizer_benchmark/m5/make_qwen_configs.py; ONLY the tokenizer block, the pool size (+ the
# held-out sets file of the 110 M pool), the QA-blend share and the sweep mirror differ (--check asserts it).
# Pool 51e0a74a3d05b6cf (80 M words): packed on CPU before any GPU run (m5/prepack_summary.json):
#   pack debc6dc32fe9b37c, exact-share budget 167,333,385 tokens (need ≥ 128 500 000 = Phases 1 + 2 raw + margin),
#   per-source tokens/word {'fineweb2_arb': 2.1423, 'wikipedia_ar': 2.0915, 'arabicweb24': 2.181}, FineWeb-2 docs taken 127,900 (80 M pool: must be ≤ 128 754, the BPE-16K pack's count — the raw-text held-out documents lie beyond).
# QA blend: TyDiQA + ARCD train packs into B = 7,193 blocks for this tokenizer (qa_blend/7ca30535c501d38e);
#   share = the largest multiple of 0.005 with share × 192 000 ≤ B → 0.035 = 6,720 blocks = 0.934 of a pass.
# Phase 3, corpus_params (the Aya-Expanse-32B teacher overlay, sha256 8e4d9cd1…), decoding and sweep.tasks: the template's, byte for byte.
experiment:
  name: farasa_bpe16k_3phase_v5_distill
  description: "Qwen3-4B-Base + Farasa-BPE-16K (ours, MorphBPE-style: BPE-16K's corpus, trainer and specials, merges never cross a Farasa morpheme boundary; variant A by the pre-registered gate: Farasa joiners at training and on every encode; surface-average init): Phase 1 32.8 M + Phase 2 98.3 M mix tokens on the 80 M-word pool, Phase 3 = the v5 distillation block — the tokenizer benchmark (2026-11-08)"
  output_dir: outputs/experiments/qwen_native_vs_araroopat/farasa_bpe16k_3phase_v5_distill
  seed: 42
  deterministic: true
  runs:
    - {started_at: "2026-11-08T21:02:39+00:00", run_id: "20261108-210239_qwen_farasa_bpe16k_3phase_v5_distill", source: console}

data:
  # Tokenizer-training corpus preprocessing (base.yaml defaults, stated because they key the CAMeL cache):
  preprocessing:
    normalize_unicode: true
    remove_diacritics: false
    normalize_alef: false        # off since 2026-09-16: the fold rewrote 13 % of words into spellings no eval text uses
    remove_tatweel: true
    min_text_length: 10
    join_lone_waw: true

tokenizer:
  type: farasa_bpe
  vocab_size: 16000
  save_path: outputs/tokenizers/farasa_bpe_16k_v1a
  load_path: outputs/tokenizers/farasa_bpe_16k_v1a   # = farasa_bpe_16k_v1's tokenizer.json (trained 2026-11-08), saved as variant A + its per-word segment tables
  params: &tok_params
    min_frequency: 2
    inference_segmentation: farasa   # the pre-registered gate's decision (report §3.18; m3/gate.json)

model:
  type: qwen3
  name_or_path: Qwen/Qwen3-4B-Base
  dtype: bfloat16
  device: auto
  embedding_init:                # as qwen_bpe16k_3phase_v3.yaml (the probe's winner, docs/report.md §3.5)
    method: surface_avg
    base_tokenizer: null         # = model.name_or_path
    weighting: char_len
    norm: none
    seed: 42

training:
  pretraining_mix:
    pool:
      total_words: 80000000   # see header
  corpus_params:
    cidar:
      teacher_answers: outputs/data_cache/distill/aya_expanse_32b_v1/teacher_answers_v1.jsonl   # sha256 8e4d9cd13e3d1bc8…, see header
    bactrian_x_ar:
      teacher_answers: outputs/data_cache/distill/aya_expanse_32b_v1/teacher_answers_v1.jsonl   # sha256 8e4d9cd13e3d1bc8…, see header
    aya_ar:
      include_datasets: ["Aya-Dataset", "Dolly-v2 (T)"]   # the two free-form sub-datasets of standard_arabic
      teacher_answers: outputs/data_cache/distill/aya_expanse_32b_v1/teacher_answers_v1.jsonl   # sha256 8e4d9cd13e3d1bc8…, see header
  phases:
    embedding_alignment:         # Phase 1: new embeddings + tied lm_head on raw text, body frozen (qwen_bpe16k_3phase_v3.yaml)
      enabled: true
      datasets: [pretraining_mix]
      trainable_parameters: [embed_tokens, lm_head]
      steps: 8000                # micro-steps = updates at accumulation 1
      mix_tokens: 32768000       # 8 000 × 8 × 512 — blocks [0, 64000) of the packed corpus
      learning_rate: 5.0e-4      # embeddings only: the higher rate is safe here
      batch_size: 8
      gradient_accumulation_steps: 1
      max_length: 512
      loss_target: full_sequence
      lr_scheduler: constant
      warmup_steps: 0
    warmup:                      # Phase 2: whole model on raw text + the QA-format blend (qwen_bpe16k_3phase_v3.yaml)
      enabled: true
      datasets: [pretraining_mix]
      trainable_parameters: ["*"]
      steps: 48000               # micro-steps; 12 000 updates at accumulation 4
      mix_tokens: 98304000       # 48 000 × 4 × 512 — raw blocks from [64000, …) + the QA-blend blocks
      learning_rate: 2.0e-5      # full fine-tuning of a 4B model
      batch_size: 4
      gradient_accumulation_steps: 4
      max_length: 512
      loss_target: full_sequence
      lr_scheduler: cosine       # horizon 12 000 updates
      warmup_steps: 400          # micro-steps = 100 updates
      qa_blend:
        datasets: [tydiqa_arabic, arcd]
        share: 0.035   # ≤ one pass of this tokenizer's packed QA blocks — see header
        split: train
        seed: 42
    sft:                         # Phase 3: byte-identical to qwen_araroopat_3phase_v4.yaml
      enabled: true
      datasets: [tydiqa_arabic, arcd, arabic_squad_mcq, cidar, bactrian_x_ar, aya_ar]
      trainable_parameters: ["*"]
      mixture:
        total_examples: 45000      # ffstop: 30 000
        shares: {extractive: 0.25, mcq: 0.15, free_form: 0.60}   # ffstop: 40/30/30 -> 11 250 / 6 750 / 27 000
        within_category: equal     # 9 000 per free-form corpus; a corpus that runs dry spills to the others (water-fill)
        upsample: true             # kept from ffstop; at 1 024 tokens the extractive pool should not need it
        drop_truncated_answers: true
        seed: 42
      steps: null                # derived: 45 000 / 2 = 22 500 micro-steps = 2 813 updates at accumulation 8
      learning_rate: 2.0e-5
      batch_size: 2              # ffstop: 4
      gradient_accumulation_steps: 8   # ffstop: 4 — the same 16 sequences per update
      max_length: 1024           # ffstop: 512 — keeps AraRooPat's long free-form answers (1.96 chars/token)
      loss_target: answer_only
      lr_scheduler: cosine       # horizon 2 813 updates
      warmup_steps: 800          # micro-steps = 100 updates, as before
      early_stopping:
        enabled: true
        eval_every_n_steps: 500    # micro-steps = 1 000 examples between evals (ffstop: 200 x 4 = 800)
        patience: 5
        min_delta: 5.0e-4
        min_steps_before_stop: 1500
        restore_best_at_end: true
        eval_splits: null          # cleared (null, not {}: the YAML layers deep-merge)
        eval_mixture:              # 1 000 dev records at the phase's 25/15/60, scored per answer token
          total_examples: 1000     # 500 eval batches of 2; max_length follows the phase (1 024)
          seed: 42

evaluation:
  intrinsic_metrics: true
  morphological_metrics: true
  downstream_metrics: true
  eval_row_dump: true
  score_normalization: char+pmi
  num_fewshot: 3                 # unused by freeform_cidar; kept so adding the MCQ tasks later changes nothing else

sweep:
  tokenizers:
    - type: farasa_bpe           # == tokenizer.type above; one cell → no --sweep, this list is informational
      vocab_sizes: [16000]
      params: *tok_params
  tasks:
    - type: freeform_cidar
      params: {max_output_chars: 2400}   # pinned: the fixed decoding rule of the reference cells (code default since 2026-09-21)
