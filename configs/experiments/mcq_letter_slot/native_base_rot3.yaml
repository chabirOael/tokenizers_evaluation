# Letter or slot (2026-09-25, docs/report.md §3.11): native_base under condition rot3.
# Eval only — every phase disabled; tokenizer block and model.name_or_path = configs/experiments/mcq_v5/mcq_native_base.yaml
# (checkpoint Qwen/Qwen3-4B-Base).
# One protocol for the twenty files of this folder (only experiment / tokenizer / model.name_or_path /
# label_rotation / num_fewshot differ): arabic_exam + culture_arabic_mmlu on the seeded 1 000-row subsets of
# rows_<task>.json (4-choice rows no v5 / base cell truncates; scripts/select_mcq_subset.py), max_length 4096,
# score_normalization char+pmi, row dumps on (schema 3: cont_token_ll = the per-token addends).
# rot<k>: 3-shot with the choice letters rotated over the slots by k (the demonstrations too); 0shot: no
# demonstrations, rotation 0. Intrinsic / morphological metrics off (tokenizers unchanged; MEI reads missing_rps).
experiment:
  name: native_base_rot3
  description: 'letter-slot diagnostic: native_qwen3_base checkpoint — arabic_exam + culture_arabic_mmlu on the 1 000-row
    subsets, 3-shot, letters rotated by 3, max_length 4096'
  output_dir: outputs/experiments/qwen_native_vs_araroopat/_letter_slot/native_base_rot3
  seed: 42
  deterministic: true
  created_at: '2026-09-25T11:25:46+00:00'
  runs:
    - {started_at: "2026-09-25T14:04:45+00:00", run_id: letter_slot_chain_native_base_rot3, source: cli}
tokenizer:
  type: native_qwen3
  vocab_size: null
  params:
    model_name_or_path: Qwen/Qwen3-4B-Base
  save_path: outputs/tokenizers/native_qwen3_4b
  load_path: null
model:
  type: qwen3
  name_or_path: Qwen/Qwen3-4B-Base
  dtype: bfloat16
  device: auto
training:
  phases:
    embedding_alignment:
      enabled: false
    warmup:
      enabled: false
    sft:
      enabled: false
evaluation:
  intrinsic_metrics: false
  morphological_metrics: false
  downstream_metrics: true
  eval_row_dump: true
  score_normalization: char+pmi
  num_fewshot: 3
sweep:
  tokenizers:
  - type: native_qwen3
    vocab_sizes:
    - null
    params:
      model_name_or_path: Qwen/Qwen3-4B-Base
  tasks:
  - type: arabic_exam
    params:
      max_length: 4096
      num_fewshot: 3
      label_rotation: 3
      rows_file: configs/experiments/mcq_letter_slot/rows_arabic_exam.json
  - type: culture_arabic_mmlu
    params:
      max_length: 4096
      num_fewshot: 3
      label_rotation: 3
      rows_file: configs/experiments/mcq_letter_slot/rows_culture_arabic_mmlu.json
