# Letter or slot (2026-09-25, docs/report.md §3.11): bpe128k_v5 under condition rot1.
# Eval only — every phase disabled; tokenizer block and model.name_or_path = configs/experiments/mcq_v5/mcq_bpe128k_v5.yaml
# (checkpoint outputs/experiments/qwen_native_vs_araroopat/bpe_128k_3phase_v5_distill/training/sft).
# One protocol for the twenty files of this folder (only experiment / tokenizer / model.name_or_path /
# label_rotation / num_fewshot differ): arabic_exam + culture_arabic_mmlu on the seeded 1 000-row subsets of
# rows_<task>.json (4-choice rows no v5 / base cell truncates; scripts/select_mcq_subset.py), max_length 4096,
# score_normalization char+pmi, row dumps on (schema 3: cont_token_ll = the per-token addends).
# rot<k>: 3-shot with the choice letters rotated over the slots by k (the demonstrations too); 0shot: no
# demonstrations, rotation 0. Intrinsic / morphological metrics off (tokenizers unchanged; MEI reads missing_rps).
experiment:
  name: bpe128k_v5_rot1
  description: 'letter-slot diagnostic: bpe_128k_3phase_v5_distill checkpoint — arabic_exam + culture_arabic_mmlu on the 1
    000-row subsets, 3-shot, letters rotated by 1, max_length 4096'
  output_dir: outputs/experiments/qwen_native_vs_araroopat/_letter_slot/bpe128k_v5_rot1
  seed: 42
  deterministic: true
  created_at: '2026-09-25T11:25:46+00:00'
tokenizer:
  type: bpe
  vocab_size: 128000
  params:
    min_frequency: 2
  save_path: outputs/tokenizers/bpe_128k_v1
  load_path: outputs/tokenizers/bpe_128k_v1
model:
  type: qwen3
  name_or_path: outputs/experiments/qwen_native_vs_araroopat/bpe_128k_3phase_v5_distill/training/sft
  dtype: bfloat16
  device: auto
training:
  phases:
    embedding_alignment:
      enabled: false
    warmup:
      enabled: false
    sft:
      enabled: false
evaluation:
  intrinsic_metrics: false
  morphological_metrics: false
  downstream_metrics: true
  eval_row_dump: true
  score_normalization: char+pmi
  num_fewshot: 3
sweep:
  tokenizers:
  - type: bpe
    vocab_sizes:
    - 128000
    params:
      min_frequency: 2
  tasks:
  - type: arabic_exam
    params:
      max_length: 4096
      num_fewshot: 3
      label_rotation: 1
      rows_file: configs/experiments/mcq_letter_slot/rows_arabic_exam.json
  - type: culture_arabic_mmlu
    params:
      max_length: 4096
      num_fewshot: 3
      label_rotation: 1
      rows_file: configs/experiments/mcq_letter_slot/rows_culture_arabic_mmlu.json
