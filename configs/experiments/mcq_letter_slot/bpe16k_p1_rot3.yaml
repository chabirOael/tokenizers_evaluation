# Where the letter prior comes from (2026-09-25, docs/report.md §3.12): bpe16k_p1 under condition rot3.
# Eval only — every phase disabled; tokenizer block = configs/experiments/mcq_v5/mcq_bpe16k_warmup.yaml (equal to the v5 arm's),
# model.name_or_path = the Phase 1 (embedding_alignment) checkpoint outputs/experiments/qwen_native_vs_araroopat/bpe_16k_3phase_v3/training/embedding_alignment.
# The protocol of the twenty §3.11 files of this folder (only experiment / model.name_or_path / label_rotation
# differ from the matching <arm>_v5_rot<k>.yaml): arabic_exam + culture_arabic_mmlu on the seeded 1 000-row subsets
# of rows_<task>.json, max_length 4096, 3-shot, score_normalization char+pmi, row dumps on (schema 3:
# cont_token_ll = the per-token addends). rot<k>: the choice letters rotated over the slots by k (the
# demonstrations too). No 0-shot cell for the Phase 1 / Phase 2 checkpoints. Intrinsic / morphological metrics off.
experiment:
  name: bpe16k_p1_rot3
  description: 'letter-slot trajectory: bpe_16k_3phase_v3 Phase 1 (embedding_alignment) checkpoint — arabic_exam + culture_arabic_mmlu
    on the 1 000-row subsets, 3-shot, letters rotated by 3, max_length 4096'
  output_dir: outputs/experiments/qwen_native_vs_araroopat/_letter_slot/bpe16k_p1_rot3
  seed: 42
  deterministic: true
  created_at: '2026-09-25T16:58:26+00:00'
tokenizer:
  type: bpe
  vocab_size: 16000
  params:
    min_frequency: 2
  save_path: outputs/tokenizers/bpe_16k_v3
  load_path: outputs/tokenizers/bpe_16k_v3
model:
  type: qwen3
  name_or_path: outputs/experiments/qwen_native_vs_araroopat/bpe_16k_3phase_v3/training/embedding_alignment
  dtype: bfloat16
  device: auto
training:
  phases:
    embedding_alignment:
      enabled: false
    warmup:
      enabled: false
    sft:
      enabled: false
evaluation:
  intrinsic_metrics: false
  morphological_metrics: false
  downstream_metrics: true
  eval_row_dump: true
  score_normalization: char+pmi
  num_fewshot: 3
sweep:
  tokenizers:
  - type: bpe
    vocab_sizes:
    - 16000
    params:
      min_frequency: 2
  tasks:
  - type: arabic_exam
    params:
      max_length: 4096
      num_fewshot: 3
      label_rotation: 3
      rows_file: configs/experiments/mcq_letter_slot/rows_arabic_exam.json
  - type: culture_arabic_mmlu
    params:
      max_length: 4096
      num_fewshot: 3
      label_rotation: 3
      rows_file: configs/experiments/mcq_letter_slot/rows_culture_arabic_mmlu.json
