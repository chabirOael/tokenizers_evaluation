# Where the letter prior comes from (2026-09-25, docs/report.md §3.12): araroopat_p1 under condition rot1.
# Eval only — every phase disabled; tokenizer block = configs/experiments/mcq_v5/mcq_araroopat_warmup.yaml (equal to the v5 arm's),
# model.name_or_path = the Phase 1 (embedding_alignment) checkpoint outputs/experiments/qwen_native_vs_araroopat/araroopat_3phase_v3/training/embedding_alignment.
# The protocol of the twenty §3.11 files of this folder (only experiment / model.name_or_path / label_rotation
# differ from the matching <arm>_v5_rot<k>.yaml): arabic_exam + culture_arabic_mmlu on the seeded 1 000-row subsets
# of rows_<task>.json, max_length 4096, 3-shot, score_normalization char+pmi, row dumps on (schema 3:
# cont_token_ll = the per-token addends). rot<k>: the choice letters rotated over the slots by k (the
# demonstrations too). No 0-shot cell for the Phase 1 / Phase 2 checkpoints. Intrinsic / morphological metrics off.
experiment:
  name: araroopat_p1_rot1
  description: 'letter-slot trajectory: araroopat_3phase_v3 Phase 1 (embedding_alignment) checkpoint — arabic_exam + culture_arabic_mmlu
    on the 1 000-row subsets, 3-shot, letters rotated by 1, max_length 4096'
  output_dir: outputs/experiments/qwen_native_vs_araroopat/_letter_slot/araroopat_p1_rot1
  seed: 42
  deterministic: true
  created_at: '2026-09-25T16:58:26+00:00'
  runs:
    - {started_at: "2026-09-25T18:48:20+00:00", run_id: letter_slot_traj_chain_araroopat_p1_rot1, source: cli}
