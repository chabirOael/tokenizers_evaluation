# native arm of the neutral-teacher distillation (2026-09-23, docs/report.md §3.8): Qwen/Qwen3-4B-Base untouched (Phase 3 only), the native Qwen3 tokenizer.
# A copy of qwen_native_sft_v4.yaml with ONLY these lines changed: this header, experiment.name / description /
# output_dir / created_at (v4's `runs` provenance dropped), and training.corpus_params.{cidar,
# bactrian_x_ar, aya_ar}.teacher_answers. Everything else — the Phase 3 block (mixture 45 000 at
# 25/15/60, within_category equal, upsample, drop_truncated_answers, seed 42, max_length 1 024, batch
# 2 x 8, LR 2e-5 cosine, warm-up 800, eval_mixture 1 000 every 500 from 1 500, patience 5, min_delta
# 5e-4, restore best, eval_splits null) and sweep.tasks — is v4's, byte for byte, and identical across
# the three v5 configs (araroopat / bpe16k / native_sft).
#
# Teacher: CohereLabs/aya-expanse-32b (bake-off winner, scripts/distill/bakeoff_table.py), greedy under vLLM with its own
# chat template and the fixed Arabic system prompt (arabic_eval.distill.teacher.SYSTEM_PROMPT).
# Answers: outputs/data_cache/distill/aya_expanse_32b_v1/teacher_answers_v1.jsonl
#   sha256 8e4d9cd13e3d1bc8a2cd0782266f570dc771a55f500e0609a1c808955bbcf272 (35066 records after the P1.6 filters). The overlay (finetune_corpora._apply_teacher_answers)
#   replaces each free-form record's answer by the teacher's and drops the records the teacher file lacks;
#   ids, prompts (our Alpaca-AR template), the dev partition and the exclusions are unchanged. With it the
#   early-stop signal is the per-token NLL on the dev slices' TEACHER answers, comparable across the arms.
#
# The five rules this experiment is bound by (set by the user on 2026-09-23):
#   1. Same tutor for everyone: the three arms get the same teacher answers, mixture, seed and draw rule,
#      and run unconditionally (AraRooPat -> BPE-16K -> native). Equal examples, not equal tokens: at 1 024
#      tokens drop_truncated_answers drops more long teacher answers under AraRooPat's fertility.
#   2. The teacher never sees the test: answers were generated for the train / dev slices of cidar /
#      bactrian_x_ar / aya_ar after the committed exclusions; the 250 held-out prompts are not among them
#      (asserted by id and normalized text in prompts_manifest.json).
#   3. Don't copy the teacher's mistakes: answers without EOS, over 2 400 characters, looping, degenerate,
#      under 20 characters, with a Latin letter, or echoing our template / the instruction were dropped
#      before this file was written (not regenerated).
#   4. Be honest about the ceiling: read the result as the share of the teacher's judge score that survives
#      the vocabulary change, against the teacher's own cell and the native distilled arm.
#   5. One teacher, whole: the winner's answers only, no blend, no per-prompt selection by the judge.
experiment:
  name: native_qwen3_sft_v5_distill
  description: "Phase 3 (arm v4 block) on teacher answers from CohereLabs/aya-expanse-32b — native arm of the neutral-teacher distillation"
  output_dir: outputs/experiments/qwen_native_vs_araroopat/native_qwen3_sft_v5_distill
  seed: 42
  deterministic: true
  created_at: "2026-09-23T22:25:17+00:00"
  runs:
    - {started_at: "2026-09-24T01:09:18+00:00", source: cli}

tokenizer:
  type: native_qwen3
  vocab_size: null
  load_path: null
  save_path: outputs/tokenizers/native_qwen3_4b
  params: &native_params
    model_name_or_path: Qwen/Qwen3-4B-Base

model:
  type: qwen3
  name_or_path: Qwen/Qwen3-4B-Base
  dtype: bfloat16
  device: auto

training:
  corpus_params:
    cidar:
      teacher_answers: outputs/data_cache/distill/aya_expanse_32b_v1/teacher_answers_v1.jsonl   # sha256 8e4d9cd13e3d1bc8…, see header
    bactrian_x_ar:
      teacher_answers: outputs/data_cache/distill/aya_expanse_32b_v1/teacher_answers_v1.jsonl   # sha256 8e4d9cd13e3d1bc8…, see header
    aya_ar:
      include_datasets: ["Aya-Dataset", "Dolly-v2 (T)"]
      teacher_answers: outputs/data_cache/distill/aya_expanse_32b_v1/teacher_answers_v1.jsonl   # sha256 8e4d9cd13e3d1bc8…, see header
  phases:
    embedding_alignment:
      enabled: false             # pretrained, vocab unchanged: nothing to align
    warmup:
      enabled: false             # no pretraining-mix exposure in this arm (as native_qwen3_sft)
    sft:                         # Phase 3: byte-identical to qwen_araroopat_3phase_v4.yaml
      enabled: true
      datasets: [tydiqa_arabic, arcd, arabic_squad_mcq, cidar, bactrian_x_ar, aya_ar]
      trainable_parameters: ["*"]
      mixture:
        total_examples: 45000      # ffstop: 30 000
        shares: {extractive: 0.25, mcq: 0.15, free_form: 0.60}   # ffstop: 40/30/30 -> 11 250 / 6 750 / 27 000
        within_category: equal     # 9 000 per free-form corpus; a corpus that runs dry spills to the others (water-fill)
        upsample: true             # kept from ffstop; at 1 024 tokens the extractive pool should not need it
        drop_truncated_answers: true
        seed: 42
      steps: null                # derived: 45 000 / 2 = 22 500 micro-steps = 2 813 updates at accumulation 8
      learning_rate: 2.0e-5
      batch_size: 2              # ffstop: 4
      gradient_accumulation_steps: 8   # ffstop: 4 — the same 16 sequences per update
      max_length: 1024           # ffstop: 512 — keeps AraRooPat's long free-form answers (1.96 chars/token)
      loss_target: answer_only
      lr_scheduler: cosine       # horizon 2 813 updates
      warmup_steps: 800          # micro-steps = 100 updates, as before
      early_stopping:
        enabled: true
        eval_every_n_steps: 500    # micro-steps = 1 000 examples between evals (ffstop: 200 x 4 = 800)
        patience: 5
        min_delta: 5.0e-4
        min_steps_before_stop: 1500
        restore_best_at_end: true
        eval_splits: null          # cleared (null, not {}: the YAML layers deep-merge)
        eval_mixture:              # 1 000 dev records at the phase's 25/15/60, scored per answer token
          total_examples: 1000     # 500 eval batches of 2; max_length follows the phase (1 024)
          seed: 42

evaluation:
  intrinsic_metrics: true
  morphological_metrics: true
  downstream_metrics: true
  eval_row_dump: true
  score_normalization: char+pmi
  num_fewshot: 3                 # unused by freeform_cidar

sweep:
  tokenizers:
    - type: native_qwen3
      vocab_sizes: [null]
      params: *native_params
  tasks:
    - type: freeform_cidar
      params: {max_output_chars: 2400}
