# Arm B, third attempt (2026-09-22): Qwen3-4B-Base + AraRooPat 17 074 tokens — the same tokenizer recipe as v2
# (10 000 roots / 40 000 patterns), rebuilt after the decode canonicalization (spelling-faithful CAMeL readings,
# written-form reconstruction surfaces, format characters dropped — see CLAUDE.md *AraRooPat*), with the two
# changes the v2 post-mortem asked for. v2 (`araroopat_3phase_v2`) judged 1.07 / 5 against 2.42 for the untouched
# native model: raw-text loss 1.34 nats/char after Phase 2 vs 0.82, the Phase 2 loss flat from step 2 000 of
# 10 000. Cause: `resize_token_embeddings` kept Qwen's first 17 074 rows (ASCII, bytes, English pieces) as the
# AraRooPat embeddings — an arbitrary mapping equivalent to random init — and 37 M tokens is two orders of
# magnitude below what the literature spends to recover from a vocabulary swap.
#   * model.embedding_init: the row of every AraRooPat token starts from the average Qwen embedding of the
#     surfaces it stands for (surface_avg; the probe of 2026-09-22 — scripts/probe_embedding_init.py, table in
#     outputs/experiments/qwen_native_vs_araroopat/embedding_init_probe.json — chose the variant below by
#     step-0 AND step-50 loss against legacy / random / mean).
#   * Phase 1 + 2 budget 37 M → 131 M tokens: Phase 1 32.8 M (8 000 updates, embeddings only, LR 5e-4 constant),
#     Phase 2 98.3 M (48 000 micro-steps = 12 000 updates, all parameters, LR 2e-5 cosine, warm-up 400, 7 % QA
#     blend). The 17 074-token vocab packs 2.97 tokens per pool word (20 M words gave 59.4 M tokens), so the pool
#     is 50 M words — a new pool fingerprint (rebuild ~8 min, needs HF_TOKEN for ArabicWeb24) and a repack of this
#     tokenizer (~30 min). v2 measured 57 s per M tokens in Phase 1 and 86 s in Phase 2 → ~31 min + ~2.4 h.
#   * tokenizer: loaded from outputs/tokenizers/araroopat_maxpat40k_v3 — built by scripts/train_tokenizer.py with
#     these exact params on the pipeline's own corpus split, so the probe, this run and the P4 comparator all use
#     the identical tokenizer (training it in-run would produce the same vocab; loading saves the 12 min).
#   * Phase 3 and eval exactly as v2: mixture 30 000 at 40/30/30, LR 2e-5, drop_truncated_answers + upsample,
#     freeform_cidar at 2 400 chars under the 2026-09-21 rules.
# Acceptance (P2.4 of the 2026-09-22 brief): mix loss ≤ 1.00 nats/char after Phase 2 and ≤ 1.05 after SFT, answer
# NLL ≤ 0.90 nats/char after SFT, judge ≥ 2.0 with the paired CI vs native_qwen3_base_m2_c2400 not entirely below
# −0.5, loop stop ≤ 12 %, mean answer 150–400 chars, reference round-trip chrF ≥ 92 (diacritics-stripped).
experiment:
  name: araroopat_3phase_v3
  description: Qwen3-4B-Base + AraRooPat 17 074 tokens (v3 tokenizer, canonical decode) with surface-average embedding
    init, Phase 1 32.8 M + Phase 2 98.3 M mix tokens on a 50 M-word pool at LR 5e-4 / 2e-5, Phase 3 mixture 30 000
    at LR 2e-5 with drop_truncated_answers + upsample, free-form eval at 2 400 chars — arm B v3 of qwen_native_vs_araroopat
  output_dir: outputs/experiments/qwen_native_vs_araroopat/araroopat_3phase_v3
  seed: 42
  deterministic: true
  created_at: "2026-09-22T02:55:00+00:00"
  runs:
    - {started_at: "2026-09-22T03:34:03+00:00", run_id: "20260922-033403_qwen_araroopat_3phase_v3", source: console}

data:
  # Tokenizer-training corpus preprocessing (base.yaml defaults, stated because they key the CAMeL cache):
  preprocessing:
    normalize_unicode: true
    remove_diacritics: false
    normalize_alef: false        # off since 2026-09-16: the fold rewrote 13 % of words into spellings no eval text uses
    remove_tatweel: true
    min_text_length: 10
    join_lone_waw: true

tokenizer:
  type: araroopat
  vocab_size: null               # derived: roots + patterns + fixed slots (17 074 at 40 000 patterns)
  save_path: outputs/tokenizers/araroopat_maxpat40k_v3
  load_path: outputs/tokenizers/araroopat_maxpat40k_v3   # built 2026-09-22 after the decode fix (see header); null would retrain the same vocab
  params: &araroopat_params      # configs/tokenizers/araroopat.yaml with max_patterns 40 000; the sweep cell reuses the anchor
    max_roots: 10000
    max_patterns: 40000
    min_root_freq: 2
    min_pattern_freq: 2
    generator_timeout_ms: 50
    use_diacritized_surface: false
    cache_corpus_analysis: true
    add_bos_eos: true
    clitic_peeler: true
    peel_bare_alef: false
    proper_nouns: unrooted
    prepositions:
