# Decoding ablation (2026-09-23, P1 of the v4 brief) — the AraRooPat ffstop SFT checkpoint, eval only, repetition penalty 1.2.
#
# Question: how much of a cell's loop-stop rate under pure greedy decoding is a greedy attractor that a
# token-level repetition penalty removes? AraRooPat ffstop loops on 21.2 % of the 250 held-out prompts, BPE
# ffstop 19.6 %, native SFT 12.4 %, native base 6.8 %. Each of the four cells of outputs/experiments/
# qwen_decoding_ablation/ re-evaluates one existing checkpoint with repetition_penalty 1.2 (the value the
# 2026-09-18 ablation measured on the untrained base: loops 44 % -> 8 % under the v1 template) and is paired with
# its greedy twin in qwen_native_vs_araroopat/ (araroopat_3phase_v3_ffstop).
#
# Everything else is the reference rule set: exact stop markers, periodic-tail loop stop, 2 400-char budget.
# The penalty is token-level and therefore granularity-dependent (an AraRooPat clitic token recurs in every
# other word; a BPE word is one or two pieces): these cells answer "decoding or model?" for each checkpoint,
# they are NOT a cross-tokenizer comparison. Intrinsic metrics are off (the same tokenizers are measured in the
# twin cells). The penalty skips each row's left padding (native pads with the EOS id; HF's own processor would
# penalise EOS on every padded row) — see tasks/freeform/generation.py.
experiment:
  name: araroopat_3phase_v3_ffstop_rp12
  description: "AraRooPat v3 ffstop SFT checkpoint re-evaluated with repetition_penalty 1.2 (decoding ablation, eval only)"
  output_dir: outputs/experiments/qwen_decoding_ablation/araroopat_3phase_v3_ffstop_rp12
  seed: 42
  deterministic: true
  created_at: "2026-09-23T08:40:17+00:00"

tokenizer:
  type: araroopat
  vocab_size: null
  save_path: outputs/tokenizers/araroopat_maxpat40k_v3
  load_path: outputs/tokenizers/araroopat_maxpat40k_v3
  params:            # the tokenizer block of araroopat_3phase_v3_ffstop (loaded, never retrained)
    max_roots: 10000
    max_patterns: 40000
    min_root_freq: 2
    min_pattern_freq: 2
    generator_timeout_ms: 50
    use_diacritized_surface: false
    cache_corpus_analysis: true
    add_bos_eos: true
    clitic_peeler: true
    peel_bare_alef: false
    proper_nouns: unrooted
    prepositions:
