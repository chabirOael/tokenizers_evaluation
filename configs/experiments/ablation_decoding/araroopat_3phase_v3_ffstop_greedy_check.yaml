    - كيف
    - أين
    - هل
    - أي
    - كم
    - أيان
    - أنى
    - لا
    - لم
    - لن
    - لما
    - قد
    - سوف

model:
  type: qwen3
  name_or_path: outputs/experiments/qwen_native_vs_araroopat/araroopat_3phase_v3_ffstop/training/sft
  dtype: bfloat16
  device: auto

training:
  corpus_params:
    aya_ar:
      include_datasets: ["Aya-Dataset", "Dolly-v2 (T)"]
  phases:
    embedding_alignment: {enabled: false}
    warmup: {enabled: false}
    sft: {enabled: false}

evaluation:
  intrinsic_metrics: false
  morphological_metrics: false
  downstream_metrics: true
  eval_row_dump: true

sweep:
  tokenizers:
    - type: araroopat
      vocab_sizes: [null]
  tasks:
    - type: freeform_cidar
      params: {max_output_chars: 2400}
