    - أم
    - ثم
    - بل
    - لكن
    - إذا
    - إذ
    - حيث
    - كما
    - لو
    - إما
    - أما
    - إلا
    - ألا
    - بينما
    - حينما
    - عندما
    - كلما
    - لأن
    - كأن
    - ليت
    - إذن
    - هكذا
