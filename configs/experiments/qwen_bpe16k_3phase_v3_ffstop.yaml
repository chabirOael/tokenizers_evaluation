# The BPE-16K comparator, Phase 3 + free-form eval only, continued from the Phase 2 checkpoint of
# qwen_bpe16k_3phase_v3.yaml (run 20260922-091654). One change to the recipe: the early-stop signal.
#
# Why (same reason as qwen_araroopat_3phase_v3_ffstop.yaml, and this is the arm that shows it). With the
# extractive-only stop, this cell never stopped — best dev 0.3581 at micro-step 6 800 of 7 500, i.e. 27 200 of
# the 30 000 mixture examples — while the AraRooPat arm stopped at 2 400 and restored step 1 400 (5 600
# examples). Extractive records are 12 % of the mixture's loss tokens and free-form answers 87 %, so an
# extractive-only signal was deciding when the free-form 87 % stopped training, and it decided very differently
# for the two arms; a per-token loss is not comparable across tokenizers either. early_stopping.eval_mixture
# scores the phase's own dev slices at the same 40/30/30 ratio as total NLL / total answer tokens.
#
# Differences from qwen_bpe16k_3phase_v3.yaml, and nothing else:
#   * model.name_or_path = that run's Phase 2 checkpoint; Phase 1 and Phase 2 disabled.
#   * model.embedding_init removed: the checkpoint's 16 000-row matrix already holds the surface_avg rows, so
#     new == old and resize_token_embeddings is a no-op.
#   * tokenizer.load_path = the tokenizer that run saved (the original trains in-run in ~2 min; loading it
#     guarantees the same vocabulary as the checkpoint's embedding rows).
#   * early_stopping: eval_splits null, eval_mixture {total_examples: 1000, seed: 42}.
#
# Caveat on comparability: 5 % of every pool is now dev, so the seeded permutation draws a slightly different
# training set than the v3 cell did — same shares, same quotas, ~5 % fewer candidates.
#
# Acceptance (P2.4 of the 2026-09-22 brief): loop stop <= 12 % and below bpe_16k_3phase_v3's 20.8 %; judge >= 1.99
# with the paired CI vs that cell not entirely below 0; answer NLL <= 0.64 nats/char; raw-text loss on the P0
# held-out set within +0.03 nats/char of this arm's Phase 2 checkpoint (0.8461); mean answer 150-400 chars;
# EOS rate >= 77.6 %.
experiment:
  name: bpe_16k_3phase_v3_ffstop
  description: Qwen3-4B-Base + from-scratch BPE 16 000 with surface-average embedding init, Phase 1 32.8 M + Phase 2
    98.3 M mix tokens on the 50 M-word pool at LR 5e-4 / 2e-5, Phase 3 mixture 30 000 at LR 2e-5 with
    drop_truncated_answers + upsample, free-form eval at 2 400 chars — the equal-adaptation comparator of arm B v3
  output_dir: outputs/experiments/qwen_native_vs_araroopat/bpe_16k_3phase_v3_ffstop
  seed: 42
  deterministic: true
  created_at: "2026-09-22T19:56:00+00:00"

data:
  # Tokenizer-training corpus preprocessing (base.yaml defaults, stated because they key the CAMeL cache):
  preprocessing:
    normalize_unicode: true
    remove_diacritics: false
    normalize_alef: false        # off since 2026-09-16: the fold rewrote 13 % of words into spellings no eval text uses
    remove_tatweel: true
    min_text_length: 10
    join_lone_waw: true

tokenizer:
  type: bpe
  vocab_size: 16000
  save_path: outputs/tokenizers/bpe_16k_v3
  load_path: outputs/tokenizers/bpe_16k_v3   # the tokenizer run 20260922-091654 trained and saved — must match the checkpoint's rows
  params: &bpe_params            # configs/tokenizers/bpe.yaml
    min_frequency: 2

model:
  type: qwen3
  name_or_path: outputs/experiments/qwen_native_vs_araroopat/bpe_16k_3phase_v3/training/warmup   # Phase 2 checkpoint of run 20260922-091654
  dtype: bfloat16
  device: auto
  # embedding_init is deliberately absent: the checkpoint already carries the surface_avg rows, and
  # new == old makes resize_token_embeddings a no-op (verify in the run log).

training:
  pretraining_mix:
    pool:
      total_words: 80000000      # BPE-16K: 1.75 tokens/word → ~140 M tokens; the two phases below draw 131 M (own pool fingerprint)
  corpus_params:
    aya_ar:
      include_datasets: ["Aya-Dataset", "Dolly-v2 (T)"]   # the two free-form sub-datasets of standard_arabic
  phases:
    embedding_alignment:         # Phase 1: new embeddings + tied lm_head on raw text, body frozen
      enabled: false
      datasets: [pretraining_mix]
      trainable_parameters: [embed_tokens, lm_head]
      steps: 8000                # micro-steps = updates at accumulation 1 (v2: 4 000)
      mix_tokens: 32768000       # 8 000 × 8 × 512 — blocks [0, 64000) of the packed corpus
      learning_rate: 5.0e-4      # embeddings only: the higher rate is safe here
      batch_size: 8
      gradient_accumulation_steps: 1
      max_length: 512
      loss_target: full_sequence
      lr_scheduler: constant
      warmup_steps: 0
    warmup:                      # Phase 2: whole model on raw text + 7 % QA-format blend
      enabled: false
      datasets: [pretraining_mix]
      trainable_parameters: ["*"]
      steps: 48000               # micro-steps; 12 000 updates at accumulation 4 (v2: 10 000 / 2 500)
      mix_tokens: 98304000       # 48 000 × 4 × 512 — 186 240 raw blocks from [64000, …) + 5 760 QA-blend blocks
      learning_rate: 2.0e-5      # full fine-tuning of a 4B model (was 2e-4 — destructive, see header)
      batch_size: 4
      gradient_accumulation_steps: 4
      max_length: 512
      loss_target: full_sequence
      lr_scheduler: cosine       # horizon 12 000 updates
      warmup_steps: 400          # micro-steps = 100 updates
      qa_blend:
        datasets: [tydiqa_arabic, arcd]
        share: 0.03                # the QA blend is fixed TEXT, so its block count is per tokenizer: BPE-16K packs TyDiQA + ARCD
                                   # train into 5 919 blocks (214 tokens/record; AraRooPat 10 396), and 0.05 = 9 600 blocks killed
                                   # the first attempt after Phase 1. 0.03 = 5 760 blocks ≈ 13 780 records = 0.97 of a pass, the
                                   # same record exposure as v3's 0.05 (9 600 AraRooPat blocks = 0.92 of a pass).
        split: train
        seed: 42
    sft:                         # Phase 3: identical to qwen_native_sft_only.yaml except drop_truncated_answers + upsample (see header)
      enabled: true
      datasets: [tydiqa_arabic, arcd, arabic_squad_mcq, cidar, bactrian_x_ar, aya_ar]
      trainable_parameters: ["*"]
      mixture:
        total_examples: 30000
        shares: {extractive: 0.40, mcq: 0.30, free_form: 0.30}
        within_category: equal
        upsample: true             # parity with arm B v3 (a shortfall is unlikely under BPE — fewer truncations at max_length 512)
        drop_truncated_answers: true
        seed: 42
      steps: null                # derived: 30 000 / 4 = 7 500 micro-steps (early stop may end it sooner)
      learning_rate: 2.0e-5
      batch_size: 4
      gradient_accumulation_steps: 4
      max_length: 512
      loss_target: answer_only
      lr_scheduler: cosine       # horizon 1 875 updates
      warmup_steps: 400          # micro-steps = 100 updates
      early_stopping:
        enabled: true
        eval_every_n_steps: 200
        patience: 5
        min_delta: 5.0e-4
        min_steps_before_stop: 500
        restore_best_at_end: true
        eval_splits: null          # cleared (null, not {}: the YAML layers deep-merge and an empty mapping would keep base.yaml's keys)
        eval_mixture:              # the stop signal mirrors the training objective (see header)
          total_examples: 1000     # 250 eval batches of 4; drawn from the dev slices at the mixture's 40/30/30
          seed: 42

evaluation:
  intrinsic_metrics: true
  morphological_metrics: true
  downstream_metrics: true
  eval_row_dump: true
  score_normalization: char+pmi
  num_fewshot: 3                 # unused by freeform_cidar; kept so adding the MCQ tasks later changes nothing else

sweep:
  tokenizers:
    - type: bpe                  # == tokenizer.type above; one cell → no --sweep, this list is informational
      vocab_sizes: [16000]
      params: *bpe_params
  tasks:
    - type: freeform_cidar
      params: {max_output_chars: 2400}   # pinned: the fixed decoding rule of the reference cells (code default since 2026-09-21)
