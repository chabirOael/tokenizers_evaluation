# SMOKE (brief v6 §5.3) — generated from models_x_tokenizers/llama3b_araroopat_3phase_v5_distill.yaml: 30 / 32 / 30 micro-steps, a
# 60-example mixture, 10 free-form prompts; the same pools (fingerprints), tokenizer and Llama-3.2-3B checkpoint.
experiment:
  name: _smoke_llama3b_araroopat
  description: 'SMOKE of llama3b_araroopat_3phase_v5_distill.yaml (brief v6 §5.3): 30 micro-steps per phase, a 60-example
    mixture, 10 free-form prompts'
  output_dir: outputs/experiments/_smoke_llama3b_araroopat
  seed: 42
  deterministic: true
  runs:
    - {started_at: "2026-10-10T07:34:21+00:00", run_id: "20261010-073421__smoke_llama3b_araroopat", source: console}
data:
  preprocessing:
    normalize_unicode: true
    remove_diacritics: false
    normalize_alef: false
    remove_tatweel: true
    min_text_length: 10
    join_lone_waw: true
tokenizer:
  type: araroopat
  vocab_size: null
  save_path: outputs/tokenizers/araroopat_maxpat40k_v3
  load_path: outputs/tokenizers/araroopat_maxpat40k_v3
  params: &id001
    max_roots: 10000
    max_patterns: 40000
    min_root_freq: 2
    min_pattern_freq: 2
    generator_timeout_ms: 50
    use_diacritized_surface: false
    cache_corpus_analysis: true
    add_bos_eos: true
    clitic_peeler: true
    peel_bare_alef: false
    proper_nouns: unrooted
    prepositions:
    - من
    - إلى
    - عن
    - على
    - في
    - حتى
    - منذ
    - مذ
    - خلا
    - عدا
    - حاشا
    - متى
