    - كي
    - لولا
    - مع
    - تجاه
    - خلال
    - بلا
    func_words:
    - هو
    - هي
    - هم
    - هن
    - هما
    - أنا
    - أنت
    - أنتم
    - أنتن
    - أنتما
    - نحن
    - إيا
    - هذا
    - هذه
    - هذان
    - هاتان
    - هؤلاء
    - ذلك
    - تلك
    - ذاك
    - أولئك
    - الذي
    - التي
