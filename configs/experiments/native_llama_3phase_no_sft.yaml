# Native Llama tokenizer — Phase 2 only (Phase 1 + Phase 3 disabled).
#
# Companion baseline to native_llama_3phase_with_sft.yaml. Phase 1 is
# disabled because native_llama's embeddings start pretrained — Phase 1
# only damages them. Phase 3 SFT is disabled so the model never sees
# TyDiQA-Arabic + ARCD during training. Lets us isolate the (Phase 2 vs
# Phase 2 + Phase 3) delta with no Phase-1 noise.
#
# All other phase parameters inherit from configs/base.yaml.

experiment:
  name: "native_llama_3phase_no_sft"
  output_dir: "outputs/experiments/native_llama_3phase_no_sft"
  seed: 42

tokenizer:
  type: "native_llama"
  vocab_size: null
  load_path: null
  save_path: "outputs/tokenizers/native_llama"

model:
  type: "llama"
  name_or_path: "meta-llama/Llama-3.2-1B"
  dtype: "bfloat16"
  device: "auto"

training:
  phases:
    embedding_alignment:
      # See native_llama_3phase_with_sft.yaml for the rationale (35% L2
      # drift on pretrained Llama embeddings under the pre-2026-05-06
      # default Phase 1 LR).
      enabled: false
    sft:
      enabled: false

sweep:
  tokenizers:
    - type: "native_llama"
      vocab_sizes: [null]
  tasks:
    - type: "acva"
      params:
        num_fewshot: 0   # ACVA: 0-shot (T/F task — few-shot hurts under PMI)
    - type: "alghafa"
      params: {}
    - type: "arabic_exam"
      params: {}

evaluation:
  intrinsic_metrics: true
  morphological_metrics: true
  morph_sample_size: 500
  downstream_metrics: true
  failure_reports: true
  score_normalization: "char+pmi"
  num_fewshot: 3            # 3-shot in-context demos per LightEval MCQ row
  num_eval_samples: null
