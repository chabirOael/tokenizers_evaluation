experiment:
  name: araroopat
  description: Qwen3-4B-Base + AraRooPat (Balanced tier), Phase 1 + 2 on the pretraining mix + Phase 3 mixture 40/30/30
    — arm B of qwen_native_vs_araroopat
  output_dir: outputs/experiments/qwen_native_vs_araroopat/araroopat
  seed: 42
  deterministic: true
data:
  dataset_name: Jr23xd23/ArabicText-Large
  dataset_config: null
  cache_dir: outputs/data_cache
  train_split: train
  eval_split: test
  max_train_samples: null
  max_eval_samples: 10000
  preprocessing:
    normalize_unicode: true
    remove_diacritics: false
    normalize_alef: false
    remove_tatweel: true
    min_text_length: 10
    join_lone_waw: true
tokenizer:
  type: araroopat
  vocab_size: null
  params:
    max_roots: 10000
    max_patterns: 10000
    min_root_freq: 2
    min_pattern_freq: 2
    generator_timeout_ms: 50
    use_diacritized_surface: false
    cache_corpus_analysis: true
    add_bos_eos: true
    clitic_peeler: true
    peel_bare_alef: false
    proper_nouns: unrooted
    prepositions:
    - من
    - إلى
    - عن
    - على
    - في
    - حتى
    - منذ
    - مذ
    - خلا
    - عدا
    - حاشا
    - متى
