# ALL-TOKENIZERS SWEEP on the PRETRAINING MIX — same 9 cells and same eval
# benchmarks as all_tokenizers_sweep.yaml, but Phase 1 (embedding alignment)
# and Phase 2 (warmup) train on the packed raw-text mix
#
#     70 % FineWeb-2 arb_Arab  |  20 % Arabic Wikipedia  |  10 % ArabicWeb24
#
# instead of Arabic-SQuAD. The filtered pool (dedup → MSA gate → length /
# boilerplate rules) is built once and cached (Stage A); the WHOLE pool is
# packed once per tokenizer at the largest budget where the 70/20/10 shares
# hold exactly in that tokenizer's tokens (Stage B, shared across
# experiments). Each phase declares the tokens it draws (mix_tokens); the
# slices are consecutive and disjoint, so Phase 1's blocks are identical in
# every experiment on this pool and Phase 2 never repeats them.
#
# Phase 2 additionally BLENDS 7 % SFT-format QA text (qa_blend): TyDiQA-Arabic
# + ARCD train records rendered with the Phase 3 / eval surface form
# (السياق: … / السؤال: … / الإجابة: …, no chat template), packed into 512-token
# blocks like the raw text and trained with the same full-sequence loss.
# The share is taken OUT of the phase's block budget (560 of 8 000 blocks),
# so the with/without-blend arms spend identical compute.
#
# Only deltas from configs/base.yaml are listed; the mix's own knobs
# (sources, filters, dedup, thresholds) live in base.yaml under
# training.pretraining_mix and can be overridden here.
#
# Build / inspect the pool before the sweep (needs HF_TOKEN for ArabicWeb24):
#   .venv/bin/python scripts/build_pretraining_mix.py --config \
#       configs/experiments/all_tokenizers_sweep_pretrain_mix.yaml --calibrate 2000
#   .venv/bin/python scripts/build_pretraining_mix.py --config \
#       configs/experiments/all_tokenizers_sweep_pretrain_mix.yaml
# Run:
#   .venv/bin/python scripts/run_experiment.py \
#       --config configs/experiments/all_tokenizers_sweep_pretrain_mix.yaml --sweep
#
# ABLATION SWITCHES
#   * pure raw-text Phase 2 (no QA blend, same 8 000 blocks):
#       training.phases.warmup.qa_blend: null
#   * keep the answer-only QA warmup and change only Phase 1:
#       training.phases.warmup.datasets: ["arabic_squad"]
#       training.phases.warmup.loss_target: "answer_only"
#       training.phases.warmup.mix_tokens: null
#       training.phases.warmup.qa_blend: null

experiment:
  name: "all_tokenizers_sweep_pretrain_mix"
  output_dir: "outputs/experiments/all_tokenizers_sweep_pretrain_mix"
  description: "All tokenizers; Phase 1 + Phase 2 on the FineWeb-2 / Wikipedia / ArabicWeb24 packed mix."
  seed: 42
  deterministic: true

data:
  max_eval_samples: 10000

tokenizer:
  type: "native_llama"
  vocab_size: null
  load_path: null
  save_path: "outputs/tokenizers/native_llama"
  params: {}

model:
  type: "llama"
  name_or_path: "meta-llama/Llama-3.2-1B"
  dtype: "bfloat16"
  device: "auto"

training:
  pretraining_mix:
    block_size: 512
    # sources / pool / dedup / msa_filter / quality: inherited from base.yaml

  phases:
    embedding_alignment:
      datasets: ["pretraining_mix"]
      mix_tokens: 4096000           # blocks [0, 8000): = steps 1000 × batch_size 8 × block_size 512
      loss_target: "full_sequence"
      max_length: 512               # must equal pretraining_mix.block_size
    warmup:
      datasets: ["pretraining_mix"] # ← the flag; see ABLATION SWITCHES above
      mix_tokens: 4096000           # 8 000 blocks = steps 2000 × batch_size 4 × 512 (phase budget incl. the blend)
      loss_target: "full_sequence"
      max_length: 512
      qa_blend:                     # 560 QA blocks + raw-text blocks [8000, 15440), disjoint from Phase 1
        datasets: ["tydiqa_arabic", "arcd"]
        share: 0.07
        split: "train"              # 'validation' (held-out evaluation) and 'dev' (Phase 3 early-stop) are refused
        seed: 42

evaluation:
  intrinsic_metrics: true
  morphological_metrics: true
  morph_sample_size: 500
  downstream_metrics: true
  num_eval_samples: null
  failure_reports: true
  intrinsic_unk_report: true
  downstream_unk_report: true
  score_normalization: "char+pmi"

sweep:
  tokenizers:
    - type: "bpe"
      vocab_sizes: [32000]
      params: {min_frequency: 2}
    - type: "wordpiece"
      vocab_sizes: [32000]
      params: {min_frequency: 2}
    - type: "morpho_bpe"
      vocab_sizes: [32000]
      params: {min_frequency: 2}
    - type: "character_bert"
      vocab_sizes: [null]
      params: {max_char_len: 50, max_word_vocab: 50000}
    - type: "char_jaber"
      vocab_sizes: [null]
      params: {}
    - type: "farasa_character_bert"
      vocab_sizes: [null]
      params: {max_char_len: 25, max_word_vocab: 50000}
    - type: "charformer"
      vocab_sizes: [null]
      params: {max_block_size: 4, downsample_rate: 2, conv_kernel_size: 5, block_attention: false}
    - type: "araroopat"
      vocab_sizes: [null]
      params:
        max_roots: 10000
        max_patterns: 4000
        min_root_freq: 2
        min_pattern_freq: 2
        generator_timeout_ms: 50
        use_diacritized_surface: false
        cache_corpus_analysis: true
    - type: "native_llama"
      vocab_sizes: [null]
      params: {}
  tasks:
    - type: "acva"
      params: {max_length: 512, seed: 42, clean_latin_rows: true}
    - type: "alghafa"
      params: {max_length: 512, seed: 42, clean_latin_rows: true}
    - type: "arabic_exam"
      params: {max_length: 512, seed: 42, clean_latin_rows: true}
    - type: "culture_arabic_mmlu"
      params: {max_length: 512, seed: 42, clean_latin_rows: true}
