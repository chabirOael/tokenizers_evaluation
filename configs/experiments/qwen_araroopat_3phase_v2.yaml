# Arm B, second attempt: Qwen3-4B-Base + AraRooPat with max_patterns 40 000 (every pattern of frequency ≥ 2 —
# the true Max tier of today's inventories; vocab 17 074), all three phases, free-form eval. Delta over base.yaml.
# History: written 2026-09-21 as Balanced (4 000 patterns); the console-saved copy that ran at 11:55 carried
# 40 000 and an output_dir under a stray top-level folder. The user kept the 40 000-pattern tokenizer, the partial
# cell was moved to the output_dir below (its tokenizer, Phase 1 and Phase 2 checkpoints are intact; the run's
# log and snapshot are in <cell>/phase12_run_20260921-115522/), and Phase 3 + eval continue from the Phase 2
# checkpoint through qwen_araroopat_3phase_v2_resume_sft.yaml. This file is the full recipe for a from-scratch
# re-run (~2 h). Every setting that differs from the first attempt (cell `araroopat`, 2026-09-18: degenerate
# 50.8 %, chrF 7.6) is a consequence of a measured fix:
#   * tokenizer: one YAML anchor for the top-level block and the sweep cell — a single-cell run trains the
#     top-level `tokenizer`, the sweep cell is informational (the first run trained 10 000 patterns that way).
#   * Phase 1 / 2 budget ×4 / ×5 (4.1 M → 16.4 M and 20.5 M tokens): the AraRooPat LM was under-trained —
#     held-out raw-text loss 2.67 nats/token after Phase 2 (1.35 / char) against 2.27 (0.83 / char) for the
#     untouched native model. Measured 2026-09-21: Phase 1 942 s (loss 2.78), Phase 2 1 756 s (loss 2.48, was
#     2.57 at a fifth of the tokens). The 20 M-word pool packs to 59.4 M tokens of this vocab; the two phases
#     draw 35.4 M.
#   * Phase 2 / 3 LR 2e-4 → 2e-5 with warm-up 400 micro-steps (100 updates): 2e-4 is a LoRA-scale rate that
#     pushed the native arm's raw-text loss 2.27 → 3.4 and the AraRooPat SFT model's to 3.86; the scheduler
#     horizon is in updates since 2026-09-18, so the cosine now really decays.
#   * drop_truncated_answers: true — at ~1.9 chars/token 8.3 % of the free-form SFT records lost their answer
#     end at max_length 512 (native: 2.4 %); a truncated record carries no EOS and teaches "never stop".
#     upsample: true because the same rule leaves the extractive pool 164 records short of its 12 000 quota.
#   * Phase 3 otherwise identical to the native SFT arm (mixture 30 000 at 40/30/30, extractive dev early
#     stop) so the two arms differ in tokenizer + Phase 1/2 exposure only.
#   * eval: freeform_cidar under the 2026-09-21 rules — exact template-label stop markers, periodic-tail
#     loop stop, 2 400-char budget pinned here so the cell is comparable with the reference cells
#     native_qwen3_base_m2_c2400 / native_qwen3_sft_m2_c2400 in the same experiment folder.
# Known, unchanged: AraRooPat decodes `<unk>` as `?` (reference round-trip chrF 89.2 on the held-out
# references, native 99.4) and a tanween after ة becomes its own LIT chunk — a decode-fidelity ceiling this
# run measures, not one it fixes. The CAMeL pre-pass cache (outputs/tokenizers/araroopat_cache/) makes
# tokenizer training ~8 min; the pool (9b02b0462005e107) is reused and this vocab is already packed.
experiment:
  name: araroopat_3phase_v2
  description: Qwen3-4B-Base + AraRooPat (10 000 roots / 40 000 patterns = every pattern with freq ≥ 2, vocab 17 074),
    Phase 1 16.4 M + Phase 2 20.5 M mix tokens at LR 5e-4 / 2e-5, Phase 3 mixture 30 000 at LR 2e-5 with
    drop_truncated_answers + upsample, free-form eval at 2 400 chars — arm B v2 of qwen_native_vs_araroopat
  output_dir: outputs/experiments/qwen_native_vs_araroopat/araroopat_3phase_v2
  seed: 42
  deterministic: true
  created_at: null
  # the 11:55 run: tokenizer + Phase 1 + 2 done, Phase 3 failed (mixture shortfall)
  runs:
    - {started_at: "2026-09-21T11:55:22+00:00", run_id: "20260921-115522_qwen_araroopat_3phase_v2", source: console}

data:
  # Tokenizer-training corpus preprocessing (base.yaml defaults, stated because they key the CAMeL cache):
  preprocessing:
    normalize_unicode: true
    remove_diacritics: false
    normalize_alef: false        # off since 2026-09-16: the fold rewrote 13 % of words into spellings no eval text uses
    remove_tatweel: true
    min_text_length: 10
    join_lone_waw: true

tokenizer:
  type: araroopat
  vocab_size: null               # derived: roots + patterns + fixed slots (17 074 at 40 000 patterns)
  save_path: outputs/tokenizers/araroopat_maxpat40k_v2
  load_path: null                # train in-run (pre-pass cache hit ≈ 8 min); the resume config loads the saved one instead
  params: &araroopat_params      # configs/tokenizers/araroopat.yaml with max_patterns 40 000; the sweep cell reuses the anchor
    max_roots: 10000
    max_patterns: 40000
    min_root_freq: 2
    min_pattern_freq: 2
    generator_timeout_ms: 50
    use_diacritized_surface: false
    cache_corpus_analysis: true
    add_bos_eos: true
    clitic_peeler: true
    peel_bare_alef: false
    proper_nouns: unrooted
    prepositions:
