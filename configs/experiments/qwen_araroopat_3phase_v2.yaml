model:
  type: qwen3
  name_or_path: Qwen/Qwen3-4B-Base
  dtype: bfloat16
  device: auto

training:
  corpus_params:
    aya_ar:
      include_datasets: ["Aya-Dataset", "Dolly-v2 (T)"]   # the two free-form sub-datasets of standard_arabic
  phases:
    embedding_alignment:         # Phase 1: new embeddings + tied lm_head on raw text, body frozen
      enabled: true
      datasets: [pretraining_mix]
      trainable_parameters: [embed_tokens, lm_head]
      steps: 4000                # micro-steps = updates at accumulation 1
      mix_tokens: 16384000       # 4 000 × 8 × 512 — blocks [0, 32000) of the packed corpus
      learning_rate: 5.0e-4      # embeddings only: the higher rate is safe here
      batch_size: 8
      gradient_accumulation_steps: 1
      max_length: 512
      loss_target: full_sequence
      lr_scheduler: constant
      warmup_steps: 0
    warmup:                      # Phase 2: whole model on raw text + 7 % QA-format blend
      enabled: true
      datasets: [pretraining_mix]
      trainable_parameters: ["*"]
      steps: 10000               # micro-steps; 2 500 updates at accumulation 4
      mix_tokens: 20480000       # 10 000 × 4 × 512 — blocks [32000, 69200) + 2 800 QA-blend blocks
      learning_rate: 2.0e-5      # full fine-tuning of a 4B model (was 2e-4 — destructive, see header)
      batch_size: 4
      gradient_accumulation_steps: 4
      max_length: 512
      loss_target: full_sequence
      lr_scheduler: cosine       # horizon 2 500 updates
      warmup_steps: 400          # micro-steps = 100 updates
      qa_blend:
        datasets: [tydiqa_arabic, arcd]
        share: 0.07
        split: train
        seed: 42
    sft:                         # Phase 3: identical to qwen_native_sft_only.yaml except drop_truncated_answers + upsample (see header)
      enabled: true
      datasets: [tydiqa_arabic, arcd, arabic_squad_mcq, cidar, bactrian_x_ar, aya_ar]
      trainable_parameters: ["*"]
      mixture:
        total_examples: 30000
        shares: {extractive: 0.40, mcq: 0.30, free_form: 0.30}
        within_category: equal
        upsample: true             # extractive keeps 11 836 of 12 000 at max_length 512 under this tokenizer (1 984 + 101
                                   # truncation drops, 239 cut answers) → 164 records repeat once; without it: MixtureShortfallError
        drop_truncated_answers: true
        seed: 42
      steps: null                # derived: 30 000 / 4 = 7 500 micro-steps (early stop may end it sooner)
      learning_rate: 2.0e-5
      batch_size: 4
      gradient_accumulation_steps: 4
      max_length: 512
      loss_target: answer_only
      lr_scheduler: cosine       # horizon 1 875 updates
      warmup_steps: 400          # micro-steps = 100 updates
      early_stopping:
        enabled: true
        eval_every_n_steps: 200
        patience: 5
        min_delta: 5.0e-4
        min_steps_before_stop: 500
        restore_best_at_end: true
        eval_splits: {tydiqa_arabic: dev, arcd: dev}   # extractive-only signal (a free-form dev slice is the planned next change)

evaluation:
  intrinsic_metrics: true
  morphological_metrics: true
  downstream_metrics: true
  eval_row_dump: true
  score_normalization: char+pmi
  num_fewshot: 3                 # unused by freeform_cidar; kept so adding the MCQ tasks later changes nothing else

sweep:
  tokenizers:
    - type: araroopat            # == tokenizer.type above; one cell → no --sweep, this list is informational
      vocab_sizes: [null]
      params: *araroopat_params
  tasks:
    - type: freeform_cidar
      params: {max_output_chars: 2400}   # pinned: the fixed decoding rule of the reference cells (code default since 2026-09-21)
