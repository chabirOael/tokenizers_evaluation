model:
  type: qwen3
  name_or_path: outputs/experiments/qwen_native_vs_araroopat/araroopat_3phase_v3/training/warmup   # Phase 2 checkpoint of run 20260922-045152
  dtype: bfloat16
  device: auto
  # embedding_init is deliberately absent: the checkpoint already carries v3's 17 184 surface_avg rows, and
  # new == old makes resize_token_embeddings a no-op, so no row is re-initialised (verify in the run log).

training:
  pretraining_mix:
    pool:
      total_words: 50000000      # 20 M gave 59.4 M tokens of this vocab; the two phases below draw 131 M (a new pool fingerprint)
  corpus_params:
    cidar:
      teacher_answers: outputs/data_cache/distill/aya_expanse_32b_v1/teacher_answers_v1.jsonl   # sha256 8e4d9cd13e3d1bc8…, see header
    bactrian_x_ar:
      teacher_answers: outputs/data_cache/distill/aya_expanse_32b_v1/teacher_answers_v1.jsonl   # sha256 8e4d9cd13e3d1bc8…, see header
    aya_ar:
      include_datasets: ["Aya-Dataset", "Dolly-v2 (T)"]   # the two free-form sub-datasets of standard_arabic
      teacher_answers: outputs/data_cache/distill/aya_expanse_32b_v1/teacher_answers_v1.jsonl   # sha256 8e4d9cd13e3d1bc8…, see header
  phases:
    embedding_alignment:         # Phase 1: done in run 20260922-045152 (8 000 steps, 32.8 M mix tokens, loss 3.34 → 1.96)
      enabled: false
      datasets: [pretraining_mix]
      trainable_parameters: [embed_tokens, lm_head]
      steps: 8000                # micro-steps = updates at accumulation 1 (v2: 4 000)
      mix_tokens: 32768000       # 8 000 × 8 × 512 — blocks [0, 64000) of the packed corpus
      learning_rate: 5.0e-4      # embeddings only: the higher rate is safe here
      batch_size: 8
      gradient_accumulation_steps: 1
      max_length: 512
      loss_target: full_sequence
      lr_scheduler: constant
      warmup_steps: 0
    warmup:                      # Phase 2: done in run 20260922-045152 (48 000 steps, 98.3 M mix tokens + 5 % QA blend, windows 1.80 → 1.68)
      enabled: false
      datasets: [pretraining_mix]
      trainable_parameters: ["*"]
      steps: 48000               # micro-steps; 12 000 updates at accumulation 4 (v2: 10 000 / 2 500)
      mix_tokens: 98304000       # 48 000 × 4 × 512 — 182 400 raw blocks from [64000, …) + 9 600 QA-blend blocks
      learning_rate: 2.0e-5      # full fine-tuning of a 4B model (was 2e-4 — destructive, see header)
      batch_size: 4
      gradient_accumulation_steps: 4
      max_length: 512
      loss_target: full_sequence
      lr_scheduler: cosine       # horizon 12 000 updates
      warmup_steps: 400          # micro-steps = 100 updates
      qa_blend:
        datasets: [tydiqa_arabic, arcd]
        share: 0.05                # v2 had 0.07 of 20.5 M tokens (2 800 blocks); 0.07 of 98.3 M = 13 440 blocks exceeds the packed
                                   # TyDiQA + ARCD train corpus (10 396 blocks, 5.3 M tokens) and the packer never wraps — the first
                                   # v3 attempt died here after Phase 1. 0.05 = 9 600 blocks = one pass over the QA corpus.
        split: train
        seed: 42
    sft:                         # Phase 3: the only block that differs from qwen_araroopat_3phase_v3_ffstop.yaml
      enabled: true
      datasets: [tydiqa_arabic, arcd, arabic_squad_mcq, cidar, bactrian_x_ar, aya_ar]
      trainable_parameters: ["*"]
      mixture:
        total_examples: 45000      # ffstop: 30 000
        shares: {extractive: 0.25, mcq: 0.15, free_form: 0.60}   # ffstop: 40/30/30 -> 11 250 / 6 750 / 27 000
        within_category: equal     # 9 000 per free-form corpus; a corpus that runs dry spills to the others (water-fill)
        upsample: true             # kept from ffstop; at 1 024 tokens the extractive pool should not need it
        drop_truncated_answers: true
        seed: 42
      steps: null                # derived: 45 000 / 2 = 22 500 micro-steps = 2 813 updates at accumulation 8
      learning_rate: 2.0e-5
      batch_size: 2              # ffstop: 4
      gradient_accumulation_steps: 8   # ffstop: 4 — the same 16 sequences per update
      max_length: 1024           # ffstop: 512 — keeps AraRooPat's long free-form answers (1.96 chars/token)
      loss_target: answer_only
      lr_scheduler: cosine       # horizon 2 813 updates
      warmup_steps: 800          # micro-steps = 100 updates, as before
      early_stopping:
        enabled: true
        eval_every_n_steps: 500    # micro-steps = 1 000 examples between evals (ffstop: 200 x 4 = 800)
        patience: 5
        min_delta: 5.0e-4
        min_steps_before_stop: 1500
        restore_best_at_end: true
        eval_splits: null          # cleared (null, not {}: the YAML layers deep-merge)
        eval_mixture:              # 1 000 dev records at the phase's 25/15/60, scored per answer token
          total_examples: 1000     # 500 eval batches of 2; max_length follows the phase (1 024)
          seed: 42

evaluation:
  intrinsic_metrics: true
  morphological_metrics: true
  downstream_metrics: true
  eval_row_dump: true
  score_normalization: char+pmi
  num_fewshot: 3                 # unused by freeform_cidar; kept so adding the MCQ tasks later changes nothing else

sweep:
  tokenizers:
    - type: araroopat            # == tokenizer.type above; one cell → no --sweep, this list is informational
      vocab_sizes: [null]
      params: *araroopat_params
  tasks:
    - type: freeform_cidar
      params: {max_output_chars: 2400}   # pinned: the fixed decoding rule of the reference cells (code default since 2026-09-21)
