    - إلا
    - ألا
    - بينما
    - حينما
    - عندما
    - كلما
    - لأن
    - كأن
    - ليت
    - إذن
    - هكذا
    - كذا
    - مثلما
    - طالما
    - حسبما
    - أينما
    - فيما
