# Arm B v4 (2026-09-23): Phase 3 + free-form eval only, continued from the Phase 2 checkpoint of
# qwen_araroopat_3phase_v3.yaml (run 20260922-045152) — the same starting point as
# qwen_araroopat_3phase_v3_ffstop.yaml. Only the Phase 3 block differs from ffstop.
#
# Hypothesis: the AraRooPat model has seen too few and too short free-form answers. Two measured facts:
#   1. Exposure was the lever. ffstop's mixture early stop moved AraRooPat from 5 600 to 24 000 of the 30 000
#      mixture examples: judge 2.00 -> 2.15 (paired CI above 0), loop stop 31.2 -> 21.2 %. But 30 000 at 40/30/30
#      holds only 9 000 *distinct* free-form records (3 000 per corpus, within_category equal) and the dev loss
#      plateaued on one pass over them — more steps on the same records will not help, more records might. The
#      free-form pools after dev slices + exclusions: cidar 9 227, bactrian_x_ar 63 636, aya_ar 18 738.
#   2. At max_length 512 the mixture drops AraRooPat's long free-form records (drop_truncated_answers; 1.96 chars
#      per token, so 512 tokens ~ 1 000 characters): in ffstop's manifest 938 of 10 514 free-form draws (8.9 %)
#      were dropped because 512 tokens cut the answer, plus 576 whose prompt left no room for any answer; the native
#      SFT cell dropped 408 of 9 685 (4.2 %) + 277, BPE ffstop 268 of 9 446 (2.8 %) + 178 — the long-answer tail
#      is removed from AraRooPat's training set more than from anyone else's.
#
# Differences from qwen_araroopat_3phase_v3_ffstop.yaml, and nothing else (Phase 3 block):
#   * mixture 45 000 at 25/15/60 (was 30 000 at 40/30/30): 11 250 extractive (pool 14 160), 6 750 MCQ, 27 000
#     free-form = 9 000 per corpus by the water-fill — three times ffstop's distinct free-form records. The draw
#     is a new seeded permutation over a larger quota, so the extractive / MCQ records differ from ffstop's too.
#   * max_length 1024 (was 512), batch 2 x accumulation 8 (was 4 x 4): the same 16 sequences per update, twice
#     the tokens per sequence. steps derive to 45 000 / 2 = 22 500 micro-steps = 2 813 updates; warm-up 800
#     micro-steps = 100 updates, as before; LR 2e-5 cosine unchanged.
#   * early stop: eval_mixture 1 000 dev records (its max_length follows the phase) every 500 micro-steps
#     (= 1 000 examples between evals; 200 at batch 2 would be 112 evals), min_steps_before_stop 1 500.
#
# Acceptance (P2.4 of the 2026-09-23 brief): loop stop <= 12 % and in any case < 21.2 %; judge >= 2.152 with the
# paired CI vs araroopat_3phase_v3_ffstop not entirely below 0; answer NLL per character <= ffstop's (0.788 as
# encoded / 0.787 over the raw 72 705 chars); raw-text loss within +0.03 nats/char of the Phase 2 checkpoint's
# 0.8595; mean answer 150-500 chars; EOS >= 77.6 %. Gate for replicating the Phase 3 block on BPE and native
# (qwen_bpe16k_3phase_v4.yaml, qwen_native_sft_v4.yaml): the paired CI vs ffstop above 0, or loop stop <= 15 %.
experiment:
  name: araroopat_3phase_v4
  description: Phase 3 (mixture 45 000 at 25/15/60, max_length 1024, batch 2 x 8, LR 2e-5) + free-form eval from the
    Phase 2 checkpoint of araroopat_3phase_v3 with the mixture dev stop — arm B v4 of qwen_native_vs_araroopat,
    three times the distinct free-form records of ffstop and the long-answer tail kept
  output_dir: outputs/experiments/qwen_native_vs_araroopat/araroopat_3phase_v4
  seed: 42
  deterministic: true
  created_at: "2026-09-23T08:43:30+00:00"
  runs:
    - {started_at: "2026-09-23T09:11:06+00:00", source: cli}

data:
  # Tokenizer-training corpus preprocessing (base.yaml defaults, stated because they key the CAMeL cache):
  preprocessing:
    normalize_unicode: true
    remove_diacritics: false
    normalize_alef: false        # off since 2026-09-16: the fold rewrote 13 % of words into spellings no eval text uses
    remove_tatweel: true
    min_text_length: 10
    join_lone_waw: true

tokenizer:
  type: araroopat
  vocab_size: null               # derived: roots + patterns + fixed slots (17 074 at 40 000 patterns)
  save_path: outputs/tokenizers/araroopat_maxpat40k_v3
  load_path: outputs/tokenizers/araroopat_maxpat40k_v3   # built 2026-09-22 after the decode fix (see header); null would retrain the same vocab
  params: &araroopat_params      # configs/tokenizers/araroopat.yaml with max_patterns 40 000; the sweep cell reuses the anchor
    max_roots: 10000
    max_patterns: 40000
    min_root_freq: 2
    min_pattern_freq: 2
    generator_timeout_ms: 50
    use_diacritized_surface: false
    cache_corpus_analysis: true
    add_bos_eos: true
    clitic_peeler: true
    peel_bare_alef: false
    proper_nouns: unrooted
    prepositions:
    - من
    - إلى
    - عن
    - على
    - في
    - حتى
    - منذ
    - مذ
    - خلا
    - عدا
    - حاشا
    - متى
    - لعل
    - كي
    - لولا
    - مع
    - تجاه
    - خلال
    - بلا
    func_words:
    - هو
    - هي
    - هم
    - هن
    - هما
    - أنا
    - أنت
    - أنتم
    - أنتن
    - أنتما
    - نحن
    - إيا
    - هذا
    - هذه
    - هذان
    - هاتان
    - هؤلاء
    - ذلك
    - تلك
    - ذاك
    - أولئك
    - الذي
    - التي
    - الذين
    - اللذان
    - اللتان
    - اللاتي
    - اللواتي
    - اللائي
