    - إما
    - أما
    - إلا
    - ألا
    - بينما
    - حينما
    - عندما
    - كلما
    - لأن
    - كأن
    - ليت
    - إذن
    - هكذا
    - كذا
    - مثلما
    - طالما
    - حسبما
    - أينما
    - فيما
    - ذات
    - ما
    - ماذا
    - لماذا
    - كيف
    - أين
    - هل
    - أي
    - كم
    - أيان
    - أنى
