# Arm B v2, Phase 3 + eval only, continued from the Phase 2 checkpoint of qwen_araroopat_3phase_v2.yaml
# (run 20260921-115522: tokenizer, Phase 1 and Phase 2 completed; Phase 3 failed with a MixtureShortfallError
# before its first step). Same recipe as that file with three differences, and nothing else:
#   * tokenizer.load_path = the tokenizer that run saved (10 000 roots / 40 000 patterns, vocab 17 074) — no retrain;
#   * model.name_or_path = the run's Phase 2 checkpoint (embedding matrix already 17 074 rows, so adapt_to_tokenizer
#     is a no-op) with Phase 1 and 2 disabled;
#   * mixture.upsample: true — the fix for the shortfall (164 of 12 000 extractive records repeat once).
# output_dir is the same cell, so the final all_metrics.json lands next to the Phase 1/2 checkpoints; the
# Phase 1/2 histories are in <cell>/phase12_run_20260921-115522/ (the run's log and config snapshot), not in
# all_metrics.json. The console warns that two configs share this output_dir — intended here.
experiment:
  name: araroopat_3phase_v2
  description: Phase 3 (mixture 30 000 at 40/30/30, LR 2e-5, drop_truncated_answers + upsample) + free-form eval from the
    Phase 2 checkpoint of araroopat_3phase_v2 (AraRooPat 40 000 patterns, vocab 17 074) — arm B v2 of qwen_native_vs_araroopat
  output_dir: outputs/experiments/qwen_native_vs_araroopat/araroopat_3phase_v2
  seed: 42
  deterministic: true
  runs:
    - {started_at: "2026-09-21T17:20:47+00:00", run_id: "20260921-172047_qwen_araroopat_3phase_v2_resume_sft", source: console}

data:
  # Tokenizer-training corpus preprocessing (base.yaml defaults, stated because they key the CAMeL cache):
  preprocessing:
    normalize_unicode: true
    remove_diacritics: false
    normalize_alef: false        # off since 2026-09-16: the fold rewrote 13 % of words into spellings no eval text uses
    remove_tatweel: true
    min_text_length: 10
    join_lone_waw: true

tokenizer:
  type: araroopat
  vocab_size: null
  save_path: outputs/tokenizers/araroopat_maxpat40k_v2
  load_path: outputs/tokenizers/araroopat_maxpat40k_v2               # the tokenizer the Phase 1/2 run trained and saved; train() is skipped
  params: &araroopat_params      # == the saved tokenizer's params (informational once load_path is set)
    max_roots: 10000
    max_patterns: 40000
    min_root_freq: 2
    min_pattern_freq: 2
    generator_timeout_ms: 50
    use_diacritized_surface: false
    cache_corpus_analysis: true
    add_bos_eos: true
    clitic_peeler: true
    peel_bare_alef: false
    proper_nouns: unrooted
    prepositions:
    - من
    - إلى
    - عن
    - على
    - في
    - حتى
    - منذ
    - مذ
    - خلا
    - عدا
    - حاشا
    - متى
    - لعل
    - كي
    - لولا
    - مع
    - تجاه
    - خلال
    - بلا
    func_words:
    - هو
    - هي
    - هم
    - هن
    - هما
    - أنا
    - أنت
    - أنتم
    - أنتن
    - أنتما
    - نحن
    - إيا
    - هذا
    - هذه
    - هذان
    - هاتان
    - هؤلاء
    - ذلك
    - تلك
